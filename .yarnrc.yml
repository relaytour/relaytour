compressionLevel: mixed

enableGlobalCache: true

# Aucun paquet n'exécute de script d'installation, sauf ceux que `dependenciesMeta`
# du package.json racine autorise (Prisma et esbuild). Un paquet compromis ne
# pourrait sinon exécuter du code à l'installation, en CI comme dans l'image.
enableScripts: false

nodeLinker: node-modules
