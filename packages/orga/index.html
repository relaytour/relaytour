      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Aperçu d'un lien partagé (ADR 0073). Le serveur remplace ce bloc par
         l'aperçu de l'organisation quand le proxy lui relaie la page. -->
    <!-- apercu:debut -->
    <title>Espace organisateur</title>
    <meta
      name="description"
      content="Les équipes d’une organisation préparent ici leurs activités avec Relaytour, logiciel libre présenté sur relaytour.org."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Relaytour" />
    <meta property="og:title" content="Espace organisateur" />
    <meta
      property="og:description"
      content="Les équipes d’une organisation préparent ici leurs activités avec Relaytour, logiciel libre présenté sur relaytour.org."
    />
    <meta property="og:image" content="/apercu.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Logo de Relaytour" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- apercu:fin -->
  </head>
