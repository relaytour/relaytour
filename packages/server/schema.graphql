enum AccesActivite {
  COMPLET
  DECOUVERTE
}

enum AccesPerimetre {
  AUCUN
  COMPLET
  CONSULTATION
}

"""
Accord du périmètre cible sur une déclinaison. EN_ATTENTE : la déclinaison est proposée et ne compte pas encore parmi les tâches du périmètre.
"""
enum AccordDeclinaison {
  ACCEPTE
  EN_ATTENTE
  REFUSE
}

type Activite {
  acces: AccesActivite!
  archive: Boolean!
  contactRecrutement: String
  estAdministree: Boolean!
  formulaire: Formulaire!

  """
  Vrai quand le formulaire public de l’activité accepte des demandes (ADR 0015).
  """
  formulaireOuvert: Boolean!
  groupes: [GroupePerimetres!]!
  id: ID!
  identite: IdentiteActivite!

  """Le logo de l’activité, sinon celui de l’organisation."""
  logoUrl: String
  nature: NatureActivite!
  nom: String!
  ordre: Int!
  pageEquipe: String

  """
  Les phases de l’activité, dans l’ordre : celles qu’elle déclare, sinon les phases par défaut (ADR 0025).
  """
  phases: [Phase!]!
  sigle: String
  slug: String!

  """
  Vrai quand tous les membres de l’organisation découvrent les périmètres de l’activité et formulent leurs souhaits (ADR 0012).
  """
  souhaitsOuverts: Boolean!

  """
  Le thème de l’organisation, dont l’activité surcharge les couleurs et le fond.
  """
  theme: Theme!
}

type ActiviteInstallation {
  archive: Boolean!
  nature: String!
  nom: String!

  """Périodes non archivées, celles que compte la limite."""
  periodesOuvertes: [PeriodeInstallation!]!
  slug: String!
}

type Affectation {
  """
  Vrai pour le contact principal du périmètre et de l’édition : une information, sans droit supplémentaire (ADR 0011).
  """
  contactPrincipal: Boolean!
  creeLe: DateTime!
  edition: Edition!
  id: ID!
  perimetre: Perimetre!
  personne: Personne!
}

"""
Dossier de contenu de l’organisation, en archive zip encodée en base64. Il ne contient aucune donnée personnelle.
"""
type ArchiveContenu {
  donnees: String!
  nomFichier: String!
}

"""
Le lien d’une personne avec une activité de l’organisation, toutes périodes confondues (ADR 0018).
"""
type AttributionActivite {
  activiteId: ID!

  """Vrai quand la personne administre l’activité."""
  admin: Boolean!

  """Vrai quand la personne y a au moins une affectation."""
  affectee: Boolean!

  """Vrai quand la personne y a au moins un souhait."""
  interessee: Boolean!
}

type Avancement {
  aFaire: Int!
  abandonnees: Int!
  enCours: Int!
  enRetard: Int!
  faites: Int!
  sansPersonne: Int!
  total: Int!
}

type AvancementPerimetre {
  avancement: Avancement!
  perimetre: Perimetre!
}

type BaremeScore {
  bonusATemps: Int!
  ficheCreee: Int!
  ficheModifiee: Int!
  tacheCreee: Int!
  tacheRealisee: Int!
}

"""
Le champ de la messagerie qui reçoit les destinataires : « À » pour une seule personne, « Cc » (adresses visibles) ou « Cci » (adresses cachées).
"""
enum ChampDestinataires {
  A
  CC
  CCI
}

"""
Signal qu’une chose a changé dans l’organisation active. Il ne porte aucune donnée : le client relit ses écrans.
"""
type Changement {
  activiteId: ID
  editionId: ID
  entite: EntiteChangee!
  id: ID
  perimetreId: ID
}

"""
Un commentaire écrit sur une tâche : un texte simple, daté et signé (ADR 0029).
"""
type CommentaireTache {
  """Null quand le compte de l’auteur n’existe plus."""
  auteur: Personne
  creeLe: DateTime!
  id: ID!

  """
  Le moment de la dernière modification du texte par son auteur, ou null.
  """
  modifieLe: DateTime

  """Vrai pour l’auteur, tant qu’il écrit dans le périmètre."""
  peutModifier: Boolean!

  """
  Vrai pour l’auteur et pour les admins de l’activité, tant que la période n’est pas archivée.
  """
  peutSupprimer: Boolean!
  texte: String!
}

type CouleursTheme {
  accent: String!
  accentClair: String!
  alerte: String!
  alerteClair: String!
  encre: String!
  erreur: String!
  erreurClair: String!
  primaire: String!
  primaireClair: String!
  sol1: String!
  sol2: String!
  sol3: String!
  succes: String!
  succesClair: String!
}

"""
A date string, such as 2007-12-03, compliant with the `full-date` format outlined in section 5.6 of the RFC 3339 profile of the ISO 8601 standard for representation of dates and times using the Gregorian calendar.
"""
scalar Date

"""
A date-time string at UTC, such as 2007-12-03T10:15:30Z, compliant with the `date-time` format outlined in section 5.6 of the RFC 3339 profile of the ISO 8601 standard for representation of dates and times using the Gregorian calendar.
"""
scalar DateTime

"""
Les périmètres où décliner une tâche partagée. Un texte ou une échéance absents reprennent ceux de la tâche partagée.
"""
input DeclinaisonInput {
  description: String
  echeance: Date
  perimetreIds: [ID!]!
  titre: String
}

type Demande {
  adresse: String!
  creeLe: DateTime!

  """
  Vrai quand un compte que la personne connectée peut lire porte déjà cette adresse : un membre de l’organisation pour un admin de l’organisation, une personne de ses équipes pour un admin d’activité (ADR 0018).
  """
  dejaMembre: Boolean!

  """Palier de disponibilité choisi dans le formulaire public."""
  disponibilite: String
  edition: Edition!
  id: ID!
  nom: String!
  origine: OrigineDemande!
  perimetres: [DemandePerimetre!]!

  """
  Libellé de la question complémentaire au moment du dépôt. Le réglage du formulaire peut avoir changé depuis.
  """
  question: String

  """Réponse à la question complémentaire du formulaire public."""
  reponse: String
  statut: StatutDemande!

  """Texte libre du formulaire public."""
  texte: String
  traiteeLe: DateTime
  traiteePar: Personne
}

type DemandePerimetre {
  id: ID!
  mot: String
  perimetre: Perimetre!
  proposePar: Personne
}

type DroitRedaction {
  accordeLe: DateTime!
  id: ID!
  perimetre: Perimetre
  personne: Personne!
}

type Edition {
  activite: Activite!
  annee: Int!
  debut: Date!
  fin: Date!
  id: ID!
  nom: String!
  statut: StatutEdition!
}

"""
Ce qui a changé. EQUIPE couvre les affectations et les souhaits. MESSAGE va aux admins qui lisent le message.
"""
enum EntiteChangee {
  DEMANDE
  EQUIPE
  FICHE
  MESSAGE
  NOTIFICATION
  PERIMETRE
  TACHE
}

"""
Étape de l’accord d’une déclinaison. IMPOSEE : un admin de l’activité l’a ajoutée sans accord du périmètre.
"""
enum EtapeAccord {
  ACCEPTEE
  IMPOSEE
  PROPOSEE
  REFUSEE
}

"""
Une étape de l’accord d’une déclinaison : qui l’a proposée, acceptée, refusée ou imposée, et quand.
"""
type EtapeAccordDeclinaison {
  etape: EtapeAccord!
  le: DateTime!
  par: Personne!
}

enum EtatPostes {
  COMPLET
  INCOMPLET
  SANS_PERSONNE
}

"""
Un événement du journal d’une tâche : création, modification, assignation, retrait ou changement de statut.
"""
type EvenementTache {
  """
  La personne qui a agi. Null pour un passage à « faite », sauf pour la personne qui a coché et pour les admins de l’activité.
  """
  acteur: Personne
  id: ID!
  le: DateTime!

  """Pour une assignation ou un retrait : la personne concernée."""
  personne: Personne
  statut: StatutTache
  type: TypeEvenementTache!
}

type Fiche {
  activite: Activite!
  archive: Boolean!
  contenu: String!
  donneesPersonnelles: [String!]!
  id: ID!
  modifieeLe: DateTime!
  modifieePar: String
  nombreVersions: Int
  perimetre: Perimetre
  peutModifier: Boolean!
  slug: String!
  source: SourceFiche
  taches(editionId: ID!): [Tache!]!
  titre: String!
  versionCouranteId: ID
  versions: [FicheVersion!]!
}

type FicheVersion {
  auteur: Personne
  contenu: String!
  creeLe: DateTime!
  id: ID!
  resume: String
  source: SourceFiche!
  titre: String!
}

"""
Le fil d’une tâche : ses commentaires et les événements de son journal, du plus ancien au plus récent. Chaque liste rend au plus ses 200 derniers éléments.
"""
type FilTache {
  commentaires: [CommentaireTache!]!
  evenements: [EvenementTache!]!

  """Le nombre total de commentaires de la tâche."""
  nombreCommentaires: Int!
  peutCommenter: Boolean!
  tacheId: ID!
}

"""Le fond du thème, en plus des trois arrêts du sol."""
type FondTheme {
  halo1: HaloTheme!
  halo2: HaloTheme!

  """L’arrêt à 18 % du dégradé du sol, entre sol1 et sol2."""
  transition: String!
}

enum FormatMedia {
  PNG
  SVG
}

"""
Réglage du formulaire public d’une activité : introduction, question complémentaire et paliers de disponibilité.
"""
type Formulaire {
  introduction: String
  paliers: [String!]!
  question: String
}

input FormulaireInput {
  introduction: String
  paliers: [String!]
  question: String
}

"""
Formulaire public pour rejoindre l’équipe d’une activité (ADR 0015). Lisible sans session.
"""
type FormulaireRejoindre {
  activite: String!

  """
  Adresse de rôle à laquelle demander l’accès à ses données ou leur suppression.
  """
  contact: String!
  groupes: [GroupeDuFormulaire!]!
  introduction: String
  organisation: String!

  """Paliers de disponibilité proposés."""
  paliers: [String!]!
  periode: String!

  """Libellé de la question complémentaire propre à l’organisation."""
  question: String
}

enum FrequenceResume {
  AUCUN
  HEBDOMADAIRE
  QUOTIDIEN
}

type GroupeDuFormulaire {
  libelle: String!
  perimetres: [PerimetreDuFormulaire!]!
}

"""Catégorie de périmètres déclarée par une activité."""
type GroupePerimetres {
  cle: String!
  libelle: String!
  libellePluriel: String!
}

input GroupePerimetresInput {
  cle: String!
  libelle: String!
  libellePluriel: String!
}

"""Une tache de couleur floue derrière le verre."""
type HaloTheme {
  couleur: String!

  """Opacité, de 0 à 0,35."""
  intensite: Float!
}

"""
Identité propre d’une activité. Chaque champ absent reprend la valeur de l’organisation.
"""
type IdentiteActivite {
  contactRecrutement: String
  logoPng: String
  logoSvg: String
  logoUrl: String
  pageEquipe: String

  """Couleurs et fond qui surchargent le thème de l’organisation."""
  theme: JSONObject
}

"""
Identité de l’organisation telle que ses admins la déclarent. Réservée aux admins.
"""
type IdentiteOrganisation {
  """
  Adresses de rôle hébergées chez une messagerie grand public, autorisées une par une.
  """
  adressesRoleAutorisees: [String!]!
  contactRecrutement: String

  """
  Adresse de rôle que le bouton « Support » ouvre dans la messagerie de la personne.
  """
  contactSupport: String
  contenuModifieLe: DateTime
  contenuSynchroniseLe: DateTime

  """
  Domaines des adresses de rôle. Une adresse de ces domaines passe pour institutionnelle. Ils ne limitent pas les invitations.
  """
  domainesCourrielAutorises: [String!]!
  favicon: String
  faviconUrl: String

  """
  Empreinte de l’icône de l’application installée : un PNG carré de 512 pixels (ADR 0023).
  """
  iconeApplication: String
  iconeApplicationUrl: String
  logoPng: String
  logoSvg: String
  logoUrl: String
  nom: String!
  pageEquipe: String
  sigle: String
  slug: String!

  """
  Thème déclaré, partiel : le thème par défaut complète les valeurs absentes.
  """
  theme: JSONObject
}

"""
The `JSONObject` scalar type represents JSON objects as specified by [ECMA-404](http://www.ecma-international.org/publications/files/ECMA-ST/ECMA-404.pdf).
"""
scalar JSONObject @specifiedBy(url: "http://www.ecma-international.org/publications/files/ECMA-ST/ECMA-404.pdf")

type LigneClassement {
  personne: Personne!
  rang: Int!
  score: Score!
}

"""
Plafonds d’une organisation. Un champ nul signifie aucune limite. Une limite bloque une création, jamais la lecture ni l’export.
"""
type LimitesOrganisation {
  activites: Int
  periodesOuvertes: Int
}

"""
Une valeur nulle retire la limite ; un champ absent la laisse telle quelle.
"""
input LimitesOrganisationInput {
  activites: Int
  periodesOuvertes: Int
}

"""Image enregistrée pour l’organisation, désignée par son empreinte."""
type MediaTeleverse {
  empreinte: String!
  url: String!
}

type Message {
  """Null pour un message écrit depuis l’annuaire."""
  activiteId: ID
  auteur: Personne
  champ: ChampDestinataires!
  corps: String!
  creeLe: DateTime!
  destinataires: [MessageDestinataire!]!
  editionId: ID

  """Vrai pour l’auteur du message, qui seul en change le statut."""
  estLeMien: Boolean!
  id: ID!

  """Clé du modèle de départ, connue de l’espace organisateur."""
  modele: String!
  objet: String!
  perimetreId: ID
  statut: StatutMessage!

  """Moment où l’auteur a déclaré le message envoyé ou annulé."""
  statutLe: DateTime
}

type MessageDestinataire {
  """
  Vrai quand la personne figure en copie visible d’un message en copie cachée.
  """
  enCopie: Boolean!
  id: ID!
  personne: Personne!
}

input MessageInput {
  """
  L’activité du message. Sans elle, le message vient de l’annuaire : seul un admin de l’organisation l’écrit.
  """
  activiteId: ID
  champ: ChampDestinataires!
  corps: String!
  destinataireIds: [ID!]!
  editionId: ID

  """
  Parmi les destinataires d’un message en copie cachée, les personnes placées en copie visible.
  """
  enCopieIds: [ID!]
  modele: String!
  objet: String!
  perimetreId: ID
}

type Mutation {
  """
  Enregistre l’abonnement push de cet appareil pour la personne connectée. Reste possible dans une organisation en lecture seule.
  """
  abonnerPush(
    adresse: String!

    """Agent de navigation, dont le serveur tire un libellé d’appareil."""
    agent: String
    auth: String!
    p256dh: String!
  ): Boolean!
  accepterDemande(affecter: [ID!]!, id: ID!): Demande!

  """
  Accepte ou refuse une déclinaison proposée à un périmètre. Seule une personne qui écrit dans ce périmètre répond. Une déclinaison acceptée entre parmi ses tâches.
  """
  accorderDeclinaison(accepter: Boolean!, id: ID!): Tache!
  accorderDroitRedaction(perimetreId: ID, personneId: ID!): DroitRedaction!
  affecter(editionId: ID!, perimetreId: ID!, personneId: ID!): Affectation!
  archiverActivite(archive: Boolean!, id: ID!): Activite!
  archiverFiche(archive: Boolean!, id: ID!): Fiche!
  archiverPersonne(archive: Boolean!, id: ID!): Personne!
  assignerTache(assigne: Boolean!, id: ID!, personneId: ID): Tache!

  """
  Change le statut d’une tâche. Demander le statut qu’elle a déjà ne change rien. Avec `statutAttendu`, le serveur refuse de changer un statut qu’une autre personne a modifié entre-temps (code `CONFLIT_VERSION`).
  """
  changerStatutTache(confirmer: Boolean = false, id: ID!, realiseeParId: ID, statut: StatutTache!, statutAttendu: StatutTache): Tache!

  """
  Écrit un commentaire sur une tâche et rend son fil. Toute personne qui écrit dans le périmètre de la tâche commente.
  """
  commenterTache(id: ID!, texte: String!): FilTache!
  creerActivite(groupes: [GroupePerimetresInput!], nature: NatureActivite!, nom: String!, ordre: Int = 0, phases: [PhaseInput!], sigle: String, slug: String!): Activite!
  creerEdition(activiteId: ID, annee: Int!, debut: Date!, fin: Date!, nom: String!): Edition!
  creerFiche(activiteId: ID, contenu: String!, perimetreId: ID, slug: String!, titre: String!): Fiche!
  creerMessage(message: MessageInput!): Message!
  creerOrganisation(domainesCourrielAutorises: [String!], fuseauHoraire: String, limites: LimitesOrganisationInput, nom: String!, sigle: String, slug: String!): OrganisationInstallation!
  creerPerimetre(activiteId: ID, couleur: String, description: String, groupe: String, nom: String!, ordre: Int = 0, slug: String!, type: TypePerimetre): Perimetre!
  creerTache(declinaison: DeclinaisonInput, description: String, echeance: Date, editionId: ID!, ficheId: ID, mAssigner: Boolean = false, perimetreId: ID!, titre: String!): Tache!

  """
  Décline une tâche dans d’autres périmètres de son activité : elle devient une tâche partagée. Chaque déclinaison attend l’accord de son périmètre, sauf quand un admin de l’activité l’ajoute. Un périmètre déjà servi est ignoré.
  """
  declinerTache(description: String, echeance: Date, id: ID!, perimetreIds: [ID!]!, titre: String): Tache!
  definirAdminActivite(activiteId: ID!, admin: Boolean!, personneId: ID!): Boolean!
  definirContactPrincipal(affectationId: ID!, contactPrincipal: Boolean!): Boolean!
  definirEffectif(editionId: ID!, effectif: Int!, perimetreId: ID!): Int!

  """Remplace l’ensemble des souhaits d’une personne pour une édition."""
  definirSouhaits(editionId: ID!, perimetreIds: [ID!]!, personneId: ID!): [Souhait!]!
  definirStatutMessage(id: ID!, statut: StatutMessage!): Message!

  """
  Écrit l’export complet d’une organisation dans le dossier EXPORTS_DIR du serveur et renvoie le nom du fichier. Le contenu ne transite jamais par l’API.
  """
  demanderExport(organisation: String!): String!

  """
  Retire l’abonnement push de cet appareil. Rend vrai quand un abonnement de la personne connectée a été retiré.
  """
  desabonnerPush(adresse: String!): Boolean!

  """
  Dépose une demande pour rejoindre l’équipe d’une activité dont le formulaire est ouvert. La réponse est la même que l’adresse ait déjà un compte, une demande en attente, ou ni l’un ni l’autre. Utilisable sans session.
  """
  envoyerDemande(activite: String!, disponibilite: String, email: String!, nom: String!, organisation: String, perimetres: [String!]!, reponse: String, siteWeb: String, texte: String): Boolean!

  """
  La personne connectée note son intérêt pour un périmètre (ADR 0012). Aucun mail ne part.
  """
  formulerSouhait(editionId: ID!, perimetreId: ID!): Boolean!

  """
  Ajoute une déclinaison aux tâches de son périmètre sans son accord, même après un refus. Réservé aux admins de l’activité.
  """
  imposerDeclinaison(id: ID!): Tache!
  inviterPersonne(editionId: ID, email: String!, estAdmin: Boolean = false, nom: String!, perimetresAffectes: [ID!], perimetresSouhaites: [ID!]): Personne!

  """
  Donne le rôle d’admin d’une organisation à une adresse et lui envoie une invitation. La réponse ne renvoie aucune donnée du compte.
  """
  inviterPremierAdmin(email: String!, nom: String!, organisation: String!): Boolean!

  """
  Sans identifiants, marque toutes les notifications comme lues. Reste possible dans une organisation en lecture seule.
  """
  marquerNotificationsLues(ids: [ID!]): Int!
  modifierActivite(archive: Boolean, formulaire: FormulaireInput, formulaireOuvert: Boolean, groupes: [GroupePerimetresInput!]!, id: ID!, nature: NatureActivite!, nom: String!, ordre: Int!, phases: [PhaseInput!], sigle: String, souhaitsOuverts: Boolean): Activite!

  """
  Modifie le texte d’un commentaire et rend le fil de sa tâche. Seul son auteur le modifie.
  """
  modifierCommentaire(id: ID!, texte: String!): FilTache!
  modifierEdition(debut: Date!, fin: Date!, id: ID!, nom: String!, statut: StatutEdition!): Edition!

  """
  Enregistre une nouvelle version d’une fiche. Avec `versionDeDepart`, la version lue avant la rédaction, le serveur refuse d’écraser une version enregistrée entre-temps (code `CONFLIT_VERSION`).
  """
  modifierFiche(contenu: String!, id: ID!, resume: String, titre: String!, versionDeDepart: ID): Fiche!

  """
  Remplace l’identité propre d’une activité. Un champ vide reprend la valeur de l’organisation.
  """
  modifierIdentiteActivite(contactRecrutement: String, id: ID!, logoPng: String, logoSvg: String, pageEquipe: String, theme: JSONObject): Activite!

  """
  Remplace l’identité de l’organisation. Le slug, le fuseau horaire, le statut et les limites ne changent pas ici.
  """
  modifierIdentiteOrganisation(adressesRoleAutorisees: [String!]!, contactRecrutement: String, contactSupport: String, domainesCourrielAutorises: [String!]!, favicon: String, iconeApplication: String, logoPng: String, logoSvg: String, nom: String!, pageEquipe: String, sigle: String, theme: JSONObject): IdentiteOrganisation!
  modifierOrganisationInstallation(limites: LimitesOrganisationInput, slug: String!, statut: StatutOrganisation): OrganisationInstallation!

  """
  Modifie le réglage d’un périmètre. Avec `versionAttendue`, le serveur refuse d’écraser une modification faite depuis cette version (code `CONFLIT_VERSION`).
  """
  modifierPerimetre(archive: Boolean!, couleur: String, description: String, groupe: String, id: ID!, nom: String!, ordre: Int!, type: TypePerimetre, versionAttendue: Int): Perimetre!
  modifierPersonne(estAdmin: Boolean!, id: ID!, nom: String!): Personne!
  modifierPreferencesNotification(
    """Sans valeur, ce réglage ne change pas."""
    applicationPerimetre: Boolean
    frequenceResume: FrequenceResume!

    """Sans valeur, ce réglage ne change pas."""
    mailDemandes: Boolean
    mailEcheance: Boolean!
    mailModification: Boolean!

    """Sans valeur, ce réglage ne change pas."""
    pushDemandes: Boolean

    """Sans valeur, ce réglage ne change pas."""
    pushEcheances: Boolean

    """Sans valeur, ce réglage ne change pas."""
    pushTaches: Boolean
  ): PreferencesNotification!

  """
  Modifie le contenu d’une tâche. Un champ absent ne change pas ; null efface la description, l’échéance ou la fiche. Avec `versionAttendue`, le serveur refuse d’écraser une modification faite depuis cette version (code `CONFLIT_VERSION`).
  """
  modifierTache(confirmer: Boolean = false, description: String, echeance: Date, ficheId: ID, id: ID!, titre: String, versionAttendue: Int): Tache!
  proposerPersonne(editionId: ID!, email: String!, mot: String, nom: String!, perimetreId: ID!): Boolean!
  refuserDemande(id: ID!): Demande!
  renvoyerInvitation(id: ID!): Boolean!

  """
  Restaure une version : son contenu devient une nouvelle version. Avec `versionDeDepart`, la version courante lue dans l’historique, le serveur refuse de restaurer par-dessus une version enregistrée entre-temps (code `CONFLIT_VERSION`).
  """
  restaurerVersionFiche(versionDeDepart: ID, versionId: ID!): Fiche!
  retirerAffectation(id: ID!): Boolean!
  retirerDroitRedaction(id: ID!): Boolean!

  """
  La personne connectée retire son propre souhait. Hors de ses activités, rien ne change.
  """
  retirerMonSouhait(editionId: ID!, perimetreId: ID!): Boolean!
  retirerProposition(id: ID!): Boolean!
  retirerSouhait(id: ID!): Boolean!

  """
  Supprime un commentaire, définitivement, et rend le fil de sa tâche. Son auteur le supprime, ainsi qu’un admin de l’activité.
  """
  supprimerCommentaire(id: ID!): FilTache!

  """
  Enregistre une image de l’organisation : PNG de 512 Ko au plus, ou SVG de 128 Ko au plus, sans script.
  """
  televerserMedia(donnees: String!, format: FormatMedia!): MediaTeleverse!
}

"""
Fixe le libellé de la période : édition pour un événement, saison pour une section, mandat pour une instance.
"""
enum NatureActivite {
  EVENEMENT
  MANDAT
  SAISON
}

"""Le nombre de commentaires d’une tâche."""
type NombreCommentaires {
  nombre: Int!
  tacheId: ID!
}

type NoteDeVersion {
  date: Date!
  id: String!
  role: RoleNoteDeVersion!
  texte: String!
  titre: String!
  type: TypeNoteDeVersion!
}

type Notification {
  creeLe: DateTime!
  id: ID!
  lien: String!
  lue: Boolean!
  message: String!
  type: TypeNotification!
}

"""Identité publique de l’organisation qui utilise cette installation."""
type Organisation {
  """
  Adresse du code source de l’installation, que l’AGPL oblige à proposer aux personnes qui l’utilisent.
  """
  codeSource: String!
  faviconUrl: String
  iconeApplicationUrl: String
  logoUrl: String

  """
  Adresse du manifest de l’application installée, propre à l’organisation (ADR 0023).
  """
  manifestUrl: String!

  """
  Adresse de la liste des modes d’emploi de l’espace organisateur, un par rôle.
  """
  modesDEmploi: String!
  nom: String!
  pageEquipe: String
  sigle: String
  slug: String!

  """
  Lien du bouton « Support » : l’adresse de support de l’organisation en mailto:, sinon l’action de l’hébergeur, sinon rien.
  """
  support: String
  theme: Theme!
}

"""Une organisation dont la personne connectée est membre, avec son rôle."""
type OrganisationDeLaPersonne {
  """Vrai pour l’organisation active de la requête."""
  active: Boolean!
  estAdmin: Boolean!
  nom: String!
  sigle: String
  slug: String!
  statut: String!
}

"""
Une organisation vue par l’administration de l’installation : identité, statut, limites et compteurs, sans aucune donnée de ses membres.
"""
type OrganisationInstallation {
  activites: [ActiviteInstallation!]!
  creeLe: DateTime!
  limites: LimitesOrganisation!
  nom: String!
  nombreMembres: Int!
  slug: String!
  statut: StatutOrganisation!
}

enum OrigineDemande {
  FORMULAIRE
  PROPOSITION
}

type Perimetre {
  """
  Accès de la personne connectée au périmètre (ADR 0014). COMPLET : elle lit ses tâches et ses fiches. CONSULTATION : elle lit ses tâches, son avancement et son équipe, sans ses fiches. AUCUN : elle ne lit ni ses tâches, ni son avancement, ni son équipe, ni ses fiches. Le nom et la description du périmètre restent lisibles en découverte (ADR 0012).
  """
  acces: AccesPerimetre!
  activite: Activite!
  archive: Boolean!
  avancement(editionId: ID!): Avancement!
  contactPrincipal(editionId: ID!): Personne
  couleur: String

  """
  Les déclinaisons proposées à ce périmètre pour la période, en attente de son accord.
  """
  declinaisonsProposees(editionId: ID!): [Tache!]!

  """
  Une ou deux phrases qui présentent le périmètre (ADR 0012). Vaut null sans description.
  """
  description: String
  fiches: [Fiche!]!
  groupe: String!
  id: ID!
  nom: String!
  ordre: Int!
  peutModifier(editionId: ID!): Boolean!
  peutRedigerFiches: Boolean!
  referents(editionId: ID!): [Personne!]!
  slug: String!
  taches(editionId: ID!): [Tache!]!
  type: TypePerimetre!

  """
  Nombre de modifications du réglage. `modifierPerimetre` la reçoit en `versionAttendue`.
  """
  version: Int!
}

type PerimetreDecouvert {
  """Vrai si la personne est affectée à ce périmètre pour la période."""
  affecte: Boolean!
  perimetre: Perimetre!

  """
  Nombre de personnes encore recherchées pour la période : l’effectif moins les affectations. Nul sans période.
  """
  personnesRecherchees: Int

  """Vrai si la personne a un souhait pour ce périmètre et la période."""
  souhaite: Boolean!
}

type PerimetreDuFormulaire {
  couleur: String

  """
  Vaut null sans description, ou si elle contient une coordonnée personnelle.
  """
  description: String
  nom: String!
  slug: String!
}

type PeriodeInstallation {
  annee: Int!
  debut: Date!
  fin: Date!
  nom: String!
  statut: String!
}

type Personne {
  activitesAdministrees: [ID!]!
  affectations(editionId: ID): [Affectation!]!
  archive: Boolean!
  attributions: [AttributionActivite!]!
  creeLe: DateTime!
  email: String!
  estAdmin: Boolean
  id: ID!
  nom: String!
  souhaits(editionId: ID): [Souhait!]!
}

"""
Une personne trouvée par la recherche, avec les périmètres lisibles où elle est affectée.
"""
type PersonneTrouvee {
  id: ID!
  nom: String!
  perimetres: [Perimetre!]!
}

"""
Phase d’une activité. Une tâche se range dans la première phase dont la borne n’est pas dépassée.
"""
type Phase {
  cle: String!

  """
  Dernier jour de la phase, en jours depuis le premier jour de la période : J-120, J+30. La dernière phase n’en porte pas.
  """
  jusquA: String
  libelle: String!
}

input PhaseInput {
  cle: String!
  jusquA: String
  libelle: String!
}

"""Piles CSS complètes, prêtes pour font-family."""
type PolicesTheme {
  mono: String!
  texte: String!
  titre: String!
}

type PostesPerimetre {
  aPourvoir: Int!
  affectations: [Affectation!]!

  """
  Nombre de demandes pour rejoindre l’équipe qui citent ce périmètre et attendent une revue (ADR 0015).
  """
  demandesEnAttente: Int!

  """
  Vaut null tant que l’effectif n’a été ni importé ni défini pour cette édition.
  """
  effectif: Int
  etat: EtatPostes!
  perimetre: Perimetre!

  """
  Souhaits en attente : la personne n’est pas encore affectée à ce périmètre. Les comptes archivés sont exclus.
  """
  souhaits: [Souhait!]!
}

type PreferencesNotification {
  """
  Notification dans l’application quand une autre personne agit sur une tâche ou une fiche d’un périmètre où la personne est affectée.
  """
  applicationPerimetre: Boolean!
  frequenceResume: FrequenceResume!

  """
  Mail regroupé par heure quand une activité que la personne administre reçoit des demandes pour rejoindre son équipe.
  """
  mailDemandes: Boolean!
  mailEcheance: Boolean!
  mailModification: Boolean!

  """
  Notification push quand une activité que la personne administre reçoit une demande.
  """
  pushDemandes: Boolean!

  """Notification push pour les échéances proches et les retards."""
  pushEcheances: Boolean!

  """
  Notification push quand une tâche est assignée à la personne, lui est retirée, ou quand une autre personne modifie une de ses tâches (ADR 0024).
  """
  pushTaches: Boolean!
}

type Proposition {
  creeLe: DateTime!
  id: ID!
  nom: String!
  statut: StatutDemande!
}

type Query {
  """
  Vrai quand cet abonnement, désigné par son adresse, est enregistré pour la personne connectée.
  """
  abonnePush(adresse: String!): Boolean!
  activites(inclureArchives: Boolean = false): [Activite!]!
  adminsOrganisation: [Personne!]!
  affectations(editionId: ID!): [Affectation!]!

  """
  Message à diffuser pour trouver des référentes et des référents. Vaut null quand aucun périmètre n’est à pourvoir.
  """
  appelPostes(editionId: ID!): String
  avancementGlobal(editionId: ID!): [AvancementPerimetre!]!
  baremeScore: BaremeScore!
  classement(editionId: ID!): [LigneClassement!]!

  """
  Clé publique VAPID de l’installation, dont un navigateur a besoin pour s’abonner aux notifications push. Null quand le canal est fermé. Lisible sans session.
  """
  clePubliquePush: String
  demandes(editionId: ID!, statut: StatutDemande): [Demande!]!
  droitsRedaction: [DroitRedaction!]!
  editionCourante(activiteId: ID): Edition
  editions(activiteId: ID): [Edition!]!
  equipe(activiteId: ID): [Personne!]!
  exportContenu: ArchiveContenu!
  fiche(activiteId: ID, slug: String!): Fiche
  fiches(activiteId: ID, inclureArchives: Boolean = false): [Fiche!]!

  """
  Le fil d’une tâche (ADR 0029). Toute personne qui lit le périmètre de la tâche le lit ; une personne en consultation reçoit un refus.
  """
  filTache(id: ID!): FilTache!

  """
  Le formulaire d’une activité, ou null s’il est fermé. Sans slug d’organisation : l’unique organisation de l’installation. Lisible sans session.
  """
  formulaireRejoindre(activite: String!, organisation: String): FormulaireRejoindre
  health: String!
  identiteOrganisation: IdentiteOrganisation!
  mesOrganisations: [OrganisationDeLaPersonne!]!
  mesPerimetres(activiteId: ID): [Perimetre!]!
  mesPreferencesNotification: PreferencesNotification!
  mesPropositions(editionId: ID!, perimetreId: ID!): [Proposition!]!
  mesTaches(editionId: ID!): [Tache!]!

  """
  Les messages d’une activité, lus par ses admins. Sans activité : tous les messages de l’organisation, lus par ses admins seulement.
  """
  messages(activiteId: ID): [Message!]!
  moi: Personne
  monScore(editionId: ID!): Score!
  nombreNotificationsNonLues: Int!

  """
  Le nombre de commentaires de chaque tâche commentée d’une période, dans les périmètres que la personne lit. Une tâche sans commentaire est absente.
  """
  nombresCommentaires(editionId: ID!): [NombreCommentaires!]!

  """
  Notes des versions publiées, de la plus récente à la plus ancienne, limitées au rôle de la personne dans l’organisation active.
  """
  notesDeVersion: [VersionPubliee!]!
  notifications(limite: Int = 30, nonLuesSeulement: Boolean = false): [Notification!]!

  """
  Nom, sigle et thème de l’organisation active. Sans session : l’organisation désignée par son slug, sinon l’unique organisation de l’installation, sinon une identité neutre. Lisible sans session.
  """
  organisation(slug: String): Organisation!
  organisations: [OrganisationInstallation!]!
  perimetre(activiteId: ID, slug: String!): Perimetre
  perimetres(activiteId: ID, inclureArchives: Boolean = false): [Perimetre!]!
  personnes(inclureArchives: Boolean = false): [Personne!]!
  peutRedigerFichesCommunes(activiteId: ID): Boolean!
  postesAPourvoir(editionId: ID!): [PostesPerimetre!]!
  recherche(editionId: ID, texte: String!): Recherche!
  retroplanning(editionId: ID!): [Tache!]!
  tache(id: ID!): Tache!
  tachesAPrendre(editionId: ID!): [Tache!]!
  tousLesPerimetres(activiteId: ID): TousLesPerimetres!

  """
  Numéro de version de l’installation. Lisible sans session, comme sur /health.
  """
  versionInstallation: String!
}

type Recherche {
  fiches: [Fiche!]!
  personnes: [PersonneTrouvee!]!
  taches: [Tache!]!
}

"""
L’état des déclinaisons d’une tâche partagée, en nombres. Les nombres `faites` et `abandonnees` se comptent parmi les déclinaisons acceptées.
"""
type ResumeDeclinaisons {
  abandonnees: Int!
  acceptees: Int!
  enAttente: Int!
  faites: Int!
  refusees: Int!
  total: Int!
}

"""
Le rôle le moins étendu qu’une note concerne. Une personne lit les notes de son rôle et des rôles moins étendus.
"""
enum RoleNoteDeVersion {
  ADMIN_ACTIVITE
  ADMIN_ORGANISATION
  REFERENT
}

type Score {
  fichesCreees: Int!
  fichesModifiees: Int!
  points: Int!
  tachesATemps: Int!
  tachesCreees: Int!
  tachesRealisees: Int!
}

type Souhait {
  creeLe: DateTime!
  edition: Edition!
  id: ID!
  perimetre: Perimetre!
  personne: Personne!

  """
  Vaut vrai quand la personne est affectée à ce périmètre pour cette édition.
  """
  satisfait: Boolean!
}

enum SourceFiche {
  APP
  GIT
}

enum StatutDemande {
  ACCEPTEE
  EN_ATTENTE
  REFUSEE
}

enum StatutEdition {
  ARCHIVEE
  EN_COURS
  PREPARATION
}

enum StatutMessage {
  ANNULE
  ENVOYE
  EN_COURS
}

"""
ACTIVE : tout est permis. LECTURE_SEULE : les membres lisent, personne n’écrit. SUSPENDUE et ARCHIVEE : plus aucun accès.
"""
enum StatutOrganisation {
  ACTIVE
  ARCHIVEE
  LECTURE_SEULE
  SUSPENDUE
}

enum StatutTache {
  ABANDONNEE
  A_FAIRE
  EN_COURS
  FAITE
}

type Subscription {
  """
  Les changements que la personne peut voir, au fil de l’eau. Le serveur ferme le flux après quinze minutes : le client en rouvre un. Une personne garde quatre flux ouverts au plus.
  """
  changements: Changement!
}

type Tache {
  """
  Pour une déclinaison : l’accord de son périmètre. Null pour une tâche ordinaire et pour une tâche partagée.
  """
  accord: AccordDeclinaison
  assignes: [Personne!]!
  clotureePar: Personne
  creeLe: DateTime!

  """
  Les déclinaisons de cette tâche partagée, une par périmètre cible, quel que soit leur accord. Vide pour une tâche ordinaire et pour une déclinaison.
  """
  declinaisons: [Tache!]!
  description: String
  echeance: Date
  edition: Edition!
  enRetard: Boolean!
  fiche: Fiche
  historiqueAccord: [EtapeAccordDeclinaison!]!
  id: ID!
  modifieeLe: DateTime!

  """La tâche partagée dont cette tâche est la déclinaison, ou null."""
  origine: Tache
  perimetre: Perimetre!
  peutModifier: Boolean!
  realiseePar: Personne

  """
  L’état des déclinaisons de cette tâche partagée, en nombres. Tous à zéro pour une tâche ordinaire et pour une déclinaison.
  """
  resumeDeclinaisons: ResumeDeclinaisons!
  statut: StatutTache!
  termineeLe: DateTime
  titre: String!

  """
  Nombre de modifications du contenu. `modifierTache` la reçoit en `versionAttendue`.
  """
  version: Int!
}

"""
Le thème complet de l’organisation, fusionné avec le thème par défaut de Relaytour.
"""
type Theme {
  couleurs: CouleursTheme!
  fond: FondTheme!
  polices: PolicesTheme!
  typographie: TypographieTheme!
}

type TousLesPerimetres {
  """
  La période en préparation ou en cours la plus récente. Sans elle, aucun souhait ne se formule.
  """
  edition: Edition
  perimetres: [PerimetreDecouvert!]!
}

"""
Un événement du journal d’une tâche, repris dans son fil. STATUT : le champ `statut` porte le nouveau statut.
"""
enum TypeEvenementTache {
  ASSIGNEE
  CREEE
  MODIFIEE
  RETIREE
  STATUT
}

enum TypeNoteDeVersion {
  CORRECTIF
  FONCTIONNALITE
  PERFORMANCE
  RUPTURE
  SECURITE
}

enum TypeNotification {
  DECLINAISON_ACCEPTEE
  DECLINAISON_PROPOSEE
  DECLINAISON_REFUSEE
  DEMANDE_RECUE
  ECHEANCE_PROCHE
  FICHE_CREEE
  FICHE_MODIFIEE
  TACHE_ASSIGNEE
  TACHE_COMMENTEE
  TACHE_CREEE
  TACHE_DESASSIGNEE
  TACHE_EN_RETARD
  TACHE_MODIFIEE
  TACHE_STATUT
}

enum TypePerimetre {
  POLE
  SPORT
}

type TypographieTheme {
  echelleTitre: Float!
  espacementTitre: String!
  graisseCorps: Int!
  graisseTitre: Int!
}

"""
Une version de Relaytour et ses notes lisibles par la personne connectée.
"""
type VersionPubliee {
  """Date de la note la plus récente de la version."""
  date: Date!
  notes: [NoteDeVersion!]!
  numero: String!
}
