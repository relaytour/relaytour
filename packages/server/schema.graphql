  ouverteAuxLecteurs: Boolean!

  """
  Vrai quand la personne lit le dossier lié de la ressource, ou quand le document est ouvert aux lecteurs de la fiche. Faux pour une ressource d’un autre périmètre, lue dans une fiche connexe.
  """
  ouvrable: Boolean!

  """
  Les périmètres que la fiche concerne aussi et dont les lecteurs n’ouvrent pas ce document. Vide pour une personne qui ne rédige pas la fiche.
  """
  perimetresSansAcces: [Perimetre!]!
  type: TypeRessource!
}

"""
L’état des déclinaisons d’une tâche partagée, en nombres. Les nombres `faites` et `abandonnees` se comptent parmi les déclinaisons acceptées.
"""
type ResumeDeclinaisons {
  abandonnees: Int!
  acceptees: Int!
  enAttente: Int!
  faites: Int!
  refusees: Int!
  total: Int!
}

"""
Une réunion de l’agenda global d’une activité, ou de l’agenda d’un périmètre.
"""
type Reunion {
  cible: CibleConvocation

  """
  Les personnes convoquées et leur réponse, pour les personnes qui écrivent dans cet agenda. Nul sinon.
  """
  convocations: [ConvocationLue!]
  debut: DateTime!
  description: String

  """
  Vrai en consultation : le lieu, le lien de visio, la description et les tâches restent masqués.
  """
  detailMasque: Boolean!
  editionId: ID!

  """Vrai si la personne connectée est convoquée."""
  estConvoquee: Boolean!
  fin: DateTime!

  """HH:MM, dans le fuseau de l’organisation."""
  heureDebut: String!

  """HH:MM, dans le fuseau de l’organisation."""
  heureFin: String!
  id: ID!

  """Le premier jour de la réunion, dans le fuseau de l’organisation."""
  jour: String!

  """
  Le dernier jour de la réunion, dans le fuseau de l’organisation. Égal au premier jour pour une réunion d’une journée.
  """
  jourFin: String!
  lienVisio: String
  lieu: String
  maReponse: ReponseConvocation

  """Le périmètre de la réunion ; nul pour l’agenda global."""
  perimetre: Perimetre
  peutModifier: Boolean!

  """Les réponses des personnes convoquées, en nombre."""
  reponses: ReponsesReunion
  statut: StatutReunion!
  taches: [TacheLieeReunion!]!
  titre: String!
  version: Int!
}

enum RoleFournisseur {
  ECRITURE
  LECTURE
