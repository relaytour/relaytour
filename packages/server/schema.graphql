  PLACES_DIRECTES
}

type Mutation {
  """
  Enregistre l’abonnement push de cet appareil pour la personne connectée. Reste possible dans une organisation en lecture seule.
  """
  abonnerPush(
    adresse: String!

    """Agent de navigation, dont le serveur tire un libellé d’appareil."""
    agent: String
    auth: String!
    p256dh: String!
  ): Boolean!

  """
  Accepte une séquence choisie : la fiche bénévole naît ou se rattache par l’adresse, avec une place à confirmer en renfort.
  """
  accepterChoixCandidature(id: ID!): Candidature!
  accepterDemande(affecter: [ID!]!, id: ID!): Demande!

  """
  La personne accepte une invitation : elle devient membre de l’organisation, avec les périmètres proposés. Renvoie le slug de l’organisation.
  """
  accepterInvitation(id: ID!): String!

  """
  Accepte ou refuse une déclinaison proposée à un périmètre. Seule une personne qui écrit dans ce périmètre répond. Une déclinaison acceptée entre parmi ses tâches.
  """
  accorderDeclinaison(accepter: Boolean!, id: ID!): Tache!
  accorderDroitRedaction(perimetreId: ID, personneId: ID!): DroitRedaction!
  affecter(editionId: ID!, perimetreId: ID!, personneId: ID!): Affectation!
  afficherFicheConnexe(ficheId: ID!, perimetreId: ID!): Fiche!
  annulerReunion(id: ID!): Reunion!

  """
  Applique une proposition chez le fournisseur. Rend APPLIQUEE, ou ECHEC avec son message dans la proposition.
  """
  appliquerPropositionAcces(id: ID!): EtatProposition!

  """
  Applique les propositions en attente d’un dossier lié, cinquante au plus. Rend le nombre de propositions appliquées.
  """
  appliquerPropositionsDossier(dossierId: ID!): Int!
  archiverActivite(archive: Boolean!, id: ID!): Activite!
  archiverFiche(archive: Boolean!, id: ID!): Fiche!
  archiverPersonne(archive: Boolean!, id: ID!): Personne!
  assignerTache(assigne: Boolean!, id: ID!, personneId: ID): Tache!

  """
  Change le statut d’une tâche. Demander le statut qu’elle a déjà ne change rien. Avec `statutAttendu`, le serveur refuse de changer un statut qu’une autre personne a modifié entre-temps (code `CONFLIT_VERSION`).
  """
  changerStatutTache(confirmer: Boolean = false, id: ID!, realiseeParId: ID, statut: StatutTache!, statutAttendu: StatutTache): Tache!

  """
  Crée le dossier d’export des fiches dans le dossier choisi, puis lance un premier export. Le dossier choisi ne doit être ni lié, ni dans un dossier lié.
  """
  choisirDossierExport(chemin: [String!]!, emplacement: String!): ConnexionFichiers!

  """
  Clôt un sondage sur le créneau retenu. La réunion se crée ensuite depuis ce créneau.
  """
  cloreSondage(creneauId: ID!, id: ID!): Sondage!

  """
  Adresse où l’admin se connecte chez le fournisseur pour accorder l’accès à Relaytour. Elle vaut dix minutes, une seule fois.
  """
  commencerConnexionEspaceFichiers(
    fournisseur: FournisseurFichiers!

    """
    Les autorisations demandées au-delà des fichiers (ADR 0044). SharePoint et Dropbox les demandent à la connexion.
    """
    portee: PorteeConnexionFichiers
  ): String!

  """
  Commence la connexion au Nextcloud de l’association, à l’adresse donnée. L’admin ouvre ensuite la page rendue et y accorde l’accès ; Nextcloud crée un mot de passe d’application pour Relaytour.
  """
  commencerConnexionNextcloud(adresse: String!): DebutConnexionNextcloud!

  """
  Écrit un commentaire sur une tâche et rend son fil. Toute personne qui écrit dans le périmètre de la tâche commente.
  """
  commenterTache(id: ID!, texte: String!): FilTache!

  """
  Confirme l’adresse de la fiche et toutes ses places à confirmer. Utilisable sans session.
  """
  confirmerParticipation(jeton: String!): Boolean!

  """
  Connecte Google Drive par un compte de service : la clé JSON du compte, que l’organisation a créée. L’organisation partage ensuite ses dossiers avec l’adresse du compte.
  """
  connecterCompteServiceGoogle(cle: String!): ConnexionFichiers!

  """
  Crée l’abonnement à l’agenda global d’une activité, et révoque le précédent.
  """
  creerAbonnementAgendaActivite(activiteId: ID!): AdresseAbonnement!
  creerActivite(groupes: [GroupePerimetresInput!], nature: NatureActivite!, nom: String!, ordre: Int = 0, phases: [PhaseInput!], sigle: String, slug: String!): Activite!

  """Ouvre un appel à bénévoles, et rend son adresse publique."""
  creerAppelBenevoles(
    editionId: ID!
    fermeLe: DateTime!
    introduction: String
    nom: String!
    ouvertLe: DateTime!

    """Pour la portée PERIMETRE."""
    perimetreId: ID
    portee: PorteeAppel!

    """Pour la portée SEQUENCE."""
    sequenceId: ID
  ): AppelEtAdresse!

  """
  Crée une fiche bénévole. La personne qui la crée déclare l’accord de la ou du bénévole.
  """
  creerBenevole(
    """Vrai : la personne accepte que ses coordonnées soient enregistrées."""
    accord: Boolean!
    activiteId: ID!
    courriel: String
    nom: String!
    note: String

    """
    Vrai : la fiche reçoit son lien par mail à sa première place, si elle a une adresse.
    """
    prevenirParMail: Boolean = true
    telephone: String
  ): Benevole!
  creerDateCle(description: String, editionId: ID!, jour: Date!, jourFin: Date, titre: String!): DateCle!
  creerEdition(activiteId: ID, annee: Int!, debut: Date!, fin: Date!, nom: String!): Edition!
  creerFiche(activiteId: ID, contenu: String!, perimetreId: ID, slug: String!, titre: String!): Fiche!
  creerLieu(activiteId: ID!, description: String, nom: String!, ordre: Int = 0): Lieu!
  creerMessage(message: MessageInput!): Message!

  """
  Crée l’abonnement personnel, et révoque le précédent : son adresse cesse de servir.
  """
  creerMonAbonnementAgenda(inclureEcheances: Boolean = false, inclureGlobal: Boolean = true, perimetreIds: [ID!]): AdresseAbonnement!
  creerOrganisation(domainesCourrielAutorises: [String!], fuseauHoraire: String, limites: LimitesOrganisationInput, nom: String!, sigle: String, slug: String!): OrganisationInstallation!
  creerPerimetre(activiteId: ID, couleur: String, description: String, groupe: String, nom: String!, ordre: Int = 0, slug: String!, type: TypePerimetre): Perimetre!
  creerReunion(
    cible: CibleConvocation
    description: String
    editionId: ID!

    """HH:MM, dans le fuseau de l’organisation."""
    heureDebut: String!

    """HH:MM, dans le fuseau de l’organisation."""
    heureFin: String!
    jour: Date!

    """
    Le dernier jour, pour une réunion de plusieurs jours. Sans valeur : le premier jour.
    """
    jourFin: Date
    lienVisio: String
    lieu: String

    """Le périmètre ; sans valeur, l’agenda global."""
    perimetreId: ID

    """Les personnes convoquées, pour la cible CHOIX."""
    personneIds: [ID!]

    """Le sondage clos dont la réunion découle, du même agenda (ADR 0037)."""
    sondageId: ID
    tacheIds: [ID!]
    titre: String!
  ): Reunion!
  creerSequence(
    """Le nombre de renforts recherchés ; 0 ou rien : aucun."""
    besoinBenevoles: Int
    consignesBenevoles: String
    description: String
    editionId: ID!
    heureDebut: String!
    heureFin: String!
    jour: Date!

    """Pour une séquence qui passe minuit. Sans valeur : le jour."""
    jourFin: Date
    lieuId: ID

    """Le périmètre ; sans valeur, toute l’activité."""
    perimetreId: ID
    places: [PlaceSequenceInput!]
    titre: String!
  ): Sequence!
  creerSondage(
    cible: CibleConvocation!
    creneaux: [CreneauSondageInput!]!
    description: String
    editionId: ID!

    """Le périmètre ; sans valeur, l’agenda global."""
    perimetreId: ID
    personneIds: [ID!]
    titre: String!
  ): Sondage!
  creerTache(declinaison: DeclinaisonInput, description: String, echeance: Date, editionId: ID!, ficheId: ID, mAssigner: Boolean = false, perimetreId: ID!, titre: String!): Tache!

  """
  Décline une tâche dans d’autres périmètres de son activité : elle devient une tâche partagée. Chaque déclinaison attend l’accord de son périmètre, sauf quand un admin de l’activité l’ajoute. Un périmètre déjà servi est ignoré.
  """
  declinerTache(description: String, echeance: Date, id: ID!, perimetreIds: [ID!]!, titre: String): Tache!

  """
  Efface le jeton de l’espace de fichiers. Les dossiers liés restent, indisponibles jusqu’à une nouvelle connexion.
  """
  deconnecterEspaceFichiers: Boolean!
  definirAdminActivite(activiteId: ID!, admin: Boolean!, personneId: ID!): Boolean!
  definirContactPrincipal(affectationId: ID!, contactPrincipal: Boolean!): Boolean!
  definirEffectif(editionId: ID!, effectif: Int!, perimetreId: ID!): Int!

  """Remplace l’ensemble des souhaits d’une personne pour une édition."""
  definirSouhaits(editionId: ID!, perimetreIds: [ID!]!, personneId: ID!): [Souhait!]!
  definirStatutMessage(id: ID!, statut: StatutMessage!): Message!

  """
  Retire un dossier lié. Quand Relaytour a créé des accès pour ce dossier chez le fournisseur, le retrait exige `oublierAcces` : ces accès restent chez le fournisseur et ne sont plus suivis (ADR 0044).
  """
  delierDossier(id: ID!, oublierAcces: Boolean): Boolean!
  delierRessourceFiche(id: ID!): Boolean!

  """
  Écrit l’export complet d’une organisation dans le dossier EXPORTS_DIR du serveur et renvoie le nom du fichier. Le contenu ne transite jamais par l’API.
  """
  demanderExport(organisation: String!): String!

  """
  Dépose une candidature sur un appel ouvert. La réponse est la même que l’adresse ait déjà une candidature, une fiche ou un compte. Aucun mail ne part. Utilisable sans session.
  """
  deposerCandidature(
    """Vrai : la personne accepte l’enregistrement de ses données."""
    accord: Boolean!
    email: String!
    jeton: String!
    message: String
    nom: String!
    ouAilleurs: Boolean = false
    plages: [PlageDisponibiliteInput!]
    precisions: String

    """Les références des séquences choisies."""
    sequences: [String!]!
    siteWeb: String
    telephone: String
  ): Boolean!

  """
  Retire l’abonnement push de cet appareil. Rend vrai quand un abonnement de la personne connectée a été retiré.
  """
  desabonnerPush(adresse: String!): Boolean!

  """
  Écarte une proposition : rien ne change chez le fournisseur. Elle ne revient pas tant que la situation de la personne ne change pas.
  """
  ecarterPropositionAcces(id: ID!): Boolean!

  """
  Enregistre une correspondance d’import, ou remplace celle qui porte le même nom dans l’activité.
  """
  enregistrerCorrespondanceImport(activiteId: ID!, associations: JSONObject!, entetes: [String!]!, nom: String!, reglages: JSONObject!): CorrespondanceImport!

  """
  Dépose une demande pour rejoindre l’équipe d’une activité dont le formulaire est ouvert. La réponse est la même que l’adresse ait déjà un compte, une demande en attente, ou ni l’un ni l’autre. Utilisable sans session.
  """
  envoyerDemande(activite: String!, disponibilite: String, email: String!, nom: String!, organisation: String, perimetres: [String!]!, reponse: String, siteWeb: String, texte: String): Boolean!

  """
  Lance tout de suite l’export des fiches vers l’espace de fichiers. Le résultat arrive dans le rapport d’export.
  """
  exporterFichesMaintenant: Boolean!

  """Ferme un appel avant sa date de fermeture."""
  fermerAppelBenevoles(id: ID!): AppelBenevoles!

  """
  La personne connectée note son intérêt pour un périmètre (ADR 0012). Aucun mail ne part.
  """
  formulerSouhait(editionId: ID!, perimetreId: ID!): Boolean!

  """
  Fusionne deux fiches de la même activité : la fiche gardée reçoit les places, les plages et les candidatures de l’autre, qui disparaît. Réservé aux admins de l’activité.
  """
  fusionnerBenevoles(autreId: ID!, courrielDe: CoteFusion!, gardeeId: ID!, nomDe: CoteFusion!, telephoneDe: CoteFusion!): Benevole!

  """
  Importe un lot de 500 personnes au plus dans l’appel d’import de sa source. Aucun mail ne part à l’import ; la première place d’une fiche joignable envoie son lien.
  """
  importerBenevoles(
    accepterTout: Boolean = false

    """Vrai : les personnes du fichier ont donné leur accord."""
    accord: Boolean!
    editionId: ID!
    mode: ModeImport!

    """
    Le périmètre d’un import de périmètre. Sans valeur : le programme entier.
    """
    perimetreId: ID
    personnes: [PersonneImportInput!]!
    prevenirParMail: Boolean = true
    source: String!
  ): RapportImportBenevoles!

  """
  Importe les fiches des dossiers sources dans l’activité. Une fiche modifiée dans Relaytour n’est pas remplacée.
  """
  importerFichesEspace(activiteId: ID!, sources: [SourceImportFiches!]!): RapportImportFiches!

  """
  Ajoute une déclinaison aux tâches de son périmètre sans son accord, même après un refus. Réservé aux admins de l’activité.
  """
  imposerDeclinaison(id: ID!): Tache!
  inviterPersonne(activiteId: ID, editionId: ID, email: String!, estAdmin: Boolean = false, nom: String!, perimetresAffectes: [ID!], perimetresSouhaites: [ID!]): InvitationEnvoyee!

  """
  Donne le rôle d’admin d’une organisation à une adresse et lui envoie une invitation. Vrai quand l’admin est en place ; faux quand l’adresse a déjà un compte hors de l’organisation, dont l’invitation attend l’accord (ADR 0030). La réponse ne renvoie aucune donnée du compte.
  """
  inviterPremierAdmin(email: String!, nom: String!, organisation: String!): Boolean!

  """
  Le lien personnel d’une fiche, à copier : créé s’il n’existe pas. `nouveau` tire un nouveau lien, qui révoque l’ancien. Aucun mail ne part. Réservé aux personnes qui lisent ses coordonnées.
  """
  lienEspaceBenevole(benevoleId: ID!, nouveau: Boolean = false): String!

  """
  Lie un dossier du fournisseur connecté à une activité, avec ses lecteurs. Un dossier se lie une seule fois par activité.
  """
  lierDossier(activiteId: ID!, chemin: [String!]!, emplacement: String!, lecteurs: LecteursDossierInput!): DossierLie!

  """
  Lie à une fiche un dossier ou un fichier d’un dossier lié qui sert son périmètre, ou toute son activité.
  """
  lierRessourceFiche(chemin: [String!]!, dossierLieId: ID!, ficheId: ID!): RessourceFiche!

  """
  Déclare deux fiches distinctes : leur fusion ne se propose plus. Réservé aux admins de l’activité.
  """
  marquerBenevolesDistincts(aId: ID!, bId: ID!): Boolean!

  """
  Sans identifiants, marque comme lues toutes les notifications du niveau choisi, ou celles d’une activité ou d’un périmètre. Reste possible dans une organisation en lecture seule.
  """
  marquerNotificationsLues(
    activiteId: ID

    """
    Sans identifiants : les notifications d’admin plutôt que celles de la cloche.
    """
    admin: Boolean = false
    ids: [ID!]
    perimetreId: ID
  ): Int!
  masquerFicheConnexe(ficheId: ID!, perimetreId: ID!): Fiche!
  modifierActivite(adressesOrganigramme: AdressesOrganigramme, archive: Boolean, formulaire: FormulaireInput, formulaireOuvert: Boolean, groupes: [GroupePerimetresInput!]!, id: ID!, nature: NatureActivite!, nom: String!, ordre: Int!, phases: [PhaseInput!], sigle: String, souhaitsOuverts: Boolean): Activite!
  modifierAppelBenevoles(fermeLe: DateTime!, id: ID!, introduction: String, nom: String!, ouvertLe: DateTime!, versionAttendue: Int!): AppelBenevoles!
  modifierBenevole(
    courriel: String
    id: ID!
    nom: String!
    note: String

    """Sans valeur, les précisions restent telles quelles."""
    precisionsDisponibilite: String

    """Sans valeur, l’option reste telle quelle."""
    prevenirParMail: Boolean
    telephone: String
  ): Benevole!

  """
  Modifie le texte d’un commentaire et rend le fil de sa tâche. Seul son auteur le modifie.
  """
  modifierCommentaire(id: ID!, texte: String!): FilTache!
  modifierDateCle(
    description: String
    id: ID!
    jour: Date!
    jourFin: Date
    titre: String!

    """
    La version lue : le serveur refuse d’écraser une modification faite depuis.
    """
    versionAttendue: Int!
  ): DateCle!

  """
  Modifie les lecteurs et le nom affiché d’un dossier lié. Le dossier chez le fournisseur ne change pas, et ses documents liés gardent leur chemin (ADR 0043).
  """
  modifierDossierLie(
    """
    Les personnes que le dossier attend chez le fournisseur (ADR 0044). Absent : inchangé.
    """
    attendus: AttendusDossier
    id: ID!
    lecteurs: LecteursDossierInput!
    nom: String
  ): DossierLie!
  modifierEdition(debut: Date!, fin: Date!, id: ID!, nom: String!, statut: StatutEdition!): Edition!

  """
  Enregistre une nouvelle version d’une fiche. Avec `versionDeDepart`, la version lue avant la rédaction, le serveur refuse d’écraser une version enregistrée entre-temps (code `CONFLIT_VERSION`).
  """
  modifierFiche(contenu: String!, id: ID!, resume: String, titre: String!, versionDeDepart: ID): Fiche!

  """
  Remplace l’identité propre d’une activité. Un champ vide reprend la valeur de l’organisation.
  """
  modifierIdentiteActivite(contactRecrutement: String, id: ID!, logoPng: String, logoSvg: String, pageEquipe: String, theme: JSONObject): Activite!

  """
  Remplace l’identité de l’organisation. Le slug, le fuseau horaire, le statut et les limites ne changent pas ici.
  """
  modifierIdentiteOrganisation(adressesRoleAutorisees: [String!]!, contactRecrutement: String, contactSupport: String, domainesCourrielAutorises: [String!]!, favicon: String, iconeApplication: String, logoPng: String, logoSvg: String, nom: String!, pageEquipe: String, sigle: String, theme: JSONObject): IdentiteOrganisation!
  modifierLieu(archive: Boolean!, description: String, id: ID!, nom: String!, ordre: Int!): Lieu!
  modifierMonAdresseVisible(visible: Boolean!): Boolean!

  """
  La personne modifie son propre nom, qui vaut dans toutes ses organisations (ADR 0031).
  """
  modifierMonNom(nom: String!): Personne!
  modifierOrganisationInstallation(limites: LimitesOrganisationInput, slug: String!, statut: StatutOrganisation): OrganisationInstallation!

  """
  Modifie le réglage d’un périmètre. Avec `versionAttendue`, le serveur refuse d’écraser une modification faite depuis cette version (code `CONFLIT_VERSION`).
  """
  modifierPerimetre(archive: Boolean!, couleur: String, description: String, groupe: String, id: ID!, nom: String!, ordre: Int!, type: TypePerimetre, versionAttendue: Int): Perimetre!
  modifierPersonne(estAdmin: Boolean!, id: ID!, nom: String!): Personne!

  """
  Remplace les plages de disponibilité d’une fiche pour une période. Réservé aux personnes qui modifient la fiche.
  """
  modifierPlagesBenevole(benevoleId: ID!, editionId: ID!, plages: [PlageDisponibiliteInput!]!): [PlageDisponibilite!]!

  """
  Modifie les préférences de la personne dans l’organisation active (ADR 0032).
  """
  modifierPreferencesNotification(
    """Sans valeur, ce réglage ne change pas."""
    applicationEquipe: Boolean

    """Sans valeur, ce réglage ne change pas."""
    applicationPerimetre: Boolean
    frequenceResume: FrequenceResume!

    """Sans valeur, ce réglage ne change pas."""
    mailDemandes: Boolean
    mailEcheance: Boolean!
    mailModification: Boolean!

    """Sans valeur, ce réglage ne change pas."""
    pushAgenda: Boolean

    """Sans valeur, ce réglage ne change pas."""
    pushDemandes: Boolean

    """Sans valeur, ce réglage ne change pas."""
    pushEcheances: Boolean

    """Sans valeur, ce réglage ne change pas."""
    pushEquipe: Boolean

    """Sans valeur, ce réglage ne change pas."""
    pushTaches: Boolean

    """Sans valeur, ce réglage ne change pas."""
    resumeAdmin: Boolean
  ): PreferencesNotification!
  modifierReunion(
    cible: CibleConvocation
    description: String

    """HH:MM, dans le fuseau de l’organisation."""
    heureDebut: String!

    """HH:MM, dans le fuseau de l’organisation."""
    heureFin: String!
    id: ID!
    jour: Date!

    """
    Le dernier jour, pour une réunion de plusieurs jours. Sans valeur : le premier jour.
    """
    jourFin: Date
    lienVisio: String
    lieu: String

    """Les personnes convoquées, pour la cible CHOIX."""
    personneIds: [ID!]
    tacheIds: [ID!]
    titre: String!

    """
    La version lue : le serveur refuse d’écraser une modification faite depuis.
    """
    versionAttendue: Int!
  ): Reunion!

  """
  Change une séquence et ses places. Les places reçues remplacent les places actuelles.
  """
  modifierSequence(
    """Le nombre de renforts recherchés ; 0 ou rien : aucun."""
    besoinBenevoles: Int
    consignesBenevoles: String
    description: String
    heureDebut: String!
    heureFin: String!
    id: ID!
    jour: Date!

    """Pour une séquence qui passe minuit. Sans valeur : le jour."""
    jourFin: Date
    lieuId: ID
    places: [PlaceSequenceInput!]
    titre: String!

    """
    La version lue : le serveur refuse d’écraser une modification faite depuis.
    """
    versionAttendue: Int!
  ): Sequence!

  """
  Change le titre, la description et les créneaux d’un sondage ouvert. Un créneau retiré perd ses réponses.
  """
  modifierSondage(
    creneaux: [CreneauSondageInput!]!
    description: String
    id: ID!
    titre: String!

    """
    La version lue : le serveur refuse d’écraser une modification faite depuis.
    """
    versionAttendue: Int!
  ): Sondage!

  """
  Modifie le contenu d’une tâche. Un champ absent ne change pas ; null efface la description, l’échéance ou la fiche. Avec `versionAttendue`, le serveur refuse d’écraser une modification faite depuis cette version (code `CONFLIT_VERSION`).
  """
  modifierTache(confirmer: Boolean = false, description: String, echeance: Date, ficheId: ID, id: ID!, titre: String, versionAttendue: Int): Tache!

  """
  Ouvre un document lié à toute personne qui lit sa fiche, partage compris, ou retire cette ouverture (ADR 0043). Le reste du dossier lié ne s’ouvre pas.
  """
  ouvrirDocumentLie(id: ID!, ouvert: Boolean!): RessourceFiche!

  """
  Place une personne à répartir dans une séquence, en renfort. Une candidature y est acceptée ; une fiche y reçoit une place, à confirmer si elle est née d’une candidature.
  """
  placerBenevole(benevoleId: ID, candidatureId: ID, sequenceId: ID!): Sequence!
  proposerPersonne(editionId: ID!, email: String!, mot: String, nom: String!, perimetreId: ID!): Boolean!

  """
  Retire la personne d’une place à venir et prévient l’équipe. Une fiche non confirmée qu’aucune place ne retient est supprimée. Utilisable sans session.
  """
  quitterPlace(jeton: String!, ref: String!): Boolean!
  rattacherALActivite(activiteId: ID!, userId: ID!): Boolean!

  """
  Refuse tous les choix en attente d’une candidature et la clôt. Réservé aux personnes qui gèrent l’appel. Aucun mail ne part.
  """
  refuserCandidature(id: ID!): Candidature!

  """
  Refuse une séquence choisie, en attente ou en liste d’attente. Aucun mail ne part.
  """
  refuserChoixCandidature(id: ID!): Candidature!
  refuserDemande(id: ID!): Demande!

  """
  La personne refuse une invitation. L’organisation n’en est pas informée : une invitation refusée et une invitation expirée ne se distinguent pas.
  """
  refuserInvitation(id: ID!): Boolean!

  """
  Règle comment Relaytour propose les accès d’un dossier lié chez le fournisseur. Un partage ou un groupe exige une connexion qui gère les accès (ADR 0044).
  """
  reglerAccesFournisseur(ajoutsAutomatiques: Boolean!, groupeId: ID, id: ID!, invitation: Boolean!, mode: AccesFournisseurDossier!, role: RoleFournisseur!): DossierLie!
  reglerConcerneAussi(ficheId: ID!, groupes: [String!]!, perimetreIds: [ID!]!): Fiche!

  """Change le contenu de l’abonnement personnel. L’adresse ne change pas."""
  reglerMonAbonnementAgenda(inclureEcheances: Boolean!, inclureGlobal: Boolean!, perimetreIds: [ID!]): AbonnementAgenda!

  """
  Active ou coupe la vérification et la gestion des accès sans reconnexion, pour un fournisseur dont l’accès accordé les couvre déjà : Google Drive et Nextcloud (ADR 0044).
  """
  reglerPorteeConnexion(portee: PorteeConnexionFichiers!): ConnexionFichiers!

  """
  Renvoie le mail d’une invitation en attente, une fois par heure au plus.
  """
  relancerInvitation(id: ID!): Boolean!

  """Remplace l’adresse publique d’un appel : l’ancienne cesse de répondre."""
  renouvelerAdresseAppelBenevoles(id: ID!): AppelEtAdresse!
  renvoyerInvitation(id: ID!): Boolean!

  """
  Renvoie par mail le lien personnel d’une fiche joignable, une seule fois. Le lien reste le même. Réservé aux personnes qui lisent ses coordonnées.
  """
  renvoyerLienBenevole(benevoleId: ID!): Boolean!

  """
  La réponse de la personne connectée à sa convocation : présente, absente ou peut-être.
  """
  repondreConvocation(reponse: ReponseConvocation!, reunionId: ID!): Reunion!

  """
  Les réponses de la personne connectée, créneau par créneau. Un créneau absent garde sa réponse.
  """
  repondreSondage(id: ID!, reponses: [ReponseSondageInput!]!): Sondage!

  """
  Restaure une version : son contenu devient une nouvelle version. Avec `versionDeDepart`, la version courante lue dans l’historique, le serveur refuse de restaurer par-dessus une version enregistrée entre-temps (code `CONFLIT_VERSION`).
  """
  restaurerVersionFiche(versionDeDepart: ID, versionId: ID!): Fiche!
  retirerAffectation(id: ID!): Boolean!
  retirerDeLActivite(activiteId: ID!, userId: ID!): Boolean!

  """
  Arrête l’export des fiches. Les fichiers déjà écrits restent dans l’espace de fichiers.
  """
  retirerDossierExport: Boolean!
  retirerDroitRedaction(id: ID!): Boolean!

  """
  Retire une invitation en attente. Un admin d’activité retire les périmètres et les rattachements de ses activités ; l’invitation disparaît quand il n’en reste aucun.
  """
  retirerInvitation(id: ID!): Boolean!

  """
  La personne connectée retire son propre souhait. Hors de ses activités, rien ne change.
  """
  retirerMonSouhait(editionId: ID!, perimetreId: ID!): Boolean!

  """
  Retire une place d’une séquence. Le choix accepté d’une candidature reste accepté.
  """
  retirerPlaceSequence(id: ID!): Sequence!
  retirerProposition(id: ID!): Boolean!
  retirerSouhait(id: ID!): Boolean!
  revoquerAbonnementAgendaActivite(activiteId: ID!): Boolean!

  """Révoque l’abonnement personnel : son adresse cesse de servir."""
  revoquerMonAbonnementAgenda: Boolean!

  """Rouvre un appel fermé à la main, avant sa date de fermeture."""
  rouvrirAppelBenevoles(id: ID!): AppelBenevoles!

  """
  Donne l’adresse du compte d’un membre chez le fournisseur, quand elle diffère de son adresse dans Relaytour. Null : Relaytour reprend son adresse.
  """
  saisirAdresseFournisseur(adresse: String, userId: ID!): CompteFournisseurVue!

  """
  Supprime une fiche et la retire de toutes les séquences. Réservé aux admins de l’activité.
  """
  supprimerBenevole(id: ID!): Boolean!

  """
  Supprime un commentaire, définitivement, et rend le fil de sa tâche. Son auteur le supprime, ainsi qu’un admin de l’activité.
  """
  supprimerCommentaire(id: ID!): FilTache!

  """
  Supprime une correspondance d’import. Réservé à la personne qui l’a créée et aux admins de l’activité.
  """
  supprimerCorrespondanceImport(id: ID!): Boolean!
  supprimerDateCle(id: ID!): Boolean!

  """
  Supprime la fiche de la personne, avec ses plages. Refusé tant qu’une place à venir la retient. Utilisable sans session.
  """
  supprimerMaFiche(jeton: String!): Boolean!
  supprimerSequence(id: ID!): Boolean!

  """
  Supprime un sondage et ses réponses. Une réunion déjà créée reste dans l’agenda.
  """
  supprimerSondage(id: ID!): Boolean!

  """
  Enregistre une image de l’organisation : PNG de 512 Ko au plus, ou SVG de 128 Ko au plus, sans script.
  """
  televerserMedia(donnees: String!, format: FormatMedia!): MediaTeleverse!

  """
  Demande à Nextcloud si l’admin a accordé l’accès. Vrai une fois la connexion enregistrée ; faux tant qu’il n’a pas terminé.
  """
  terminerConnexionNextcloud(etat: String!): Boolean!

  """
  Lance la vérification des accès chez le fournisseur. Le résultat arrive par le flux des changements.
  """
  verifierAccesFournisseur: Boolean!
}

"""
Fixe le libellé de la période : édition pour un événement, saison pour une section, mandat pour une instance.
"""
enum NatureActivite {
  EVENEMENT
  MANDAT
  SAISON
}

"""
À quel titre la personne reçoit la notification (ADR 0033). Le niveau REFERENT reste dans la cloche ; les niveaux d’admin ont leur écran.
"""
enum NiveauNotification {
  ADMIN_ACTIVITE
  ADMIN_ORGANISATION
  REFERENT
}

"""
FORT : même adresse. MOYEN : même téléphone. FAIBLE : même nom, ou nom très proche.
"""
enum NiveauRapprochement {
  FAIBLE
  FORT
  MOYEN
}

"""Le nombre de commentaires d’une tâche."""
type NombreCommentaires {
  nombre: Int!
  tacheId: ID!
}

type NoteDeVersion {
  date: Date!
  id: String!
  role: RoleNoteDeVersion!
  texte: String!
  titre: String!
  type: TypeNoteDeVersion!
}

type Notification {
  activite: ActiviteNotifiee
  creeLe: DateTime!
  id: ID!
  lien: String!
  lue: Boolean!

  """
  Le texte affiché dans l’espace organisateur. L’activité et le périmètre s’affichent à part.
  """
  message: String!
  niveau: NiveauNotification!
  perimetre: PerimetreNotifie

  """
  Le nom de la période, quand l’activité en a plusieurs qui ne sont pas archivées.
  """
  periode: String
  type: TypeNotification!
}

"""
Une autre organisation de la personne qui a des notifications non lues (ADR 0032).
"""
type NotificationsAutreOrganisation {
  nom: String!
  nonLues: Int!
  slug: String!
}

type Organigramme {
  admins: [MembreOrganigramme!]!
  adresses: AdressesOrganigramme!

  """
  Vrai si la personne voit l’activité : elle lit alors toutes les référentes et tous les référents, et les adresses ouvertes.
  """
  complet: Boolean!

  """
  Le contact de l’activité, une adresse de rôle, sinon celui de l’organisation.
  """
  contactActivite: String

  """
  La période en préparation ou en cours la plus récente, comme pour « Tous les périmètres ».
  """
  edition: Edition
  perimetres: [PerimetreOrganigramme!]!
}

"""Identité publique de l’organisation qui utilise cette installation."""
type Organisation {
  """
  Adresse du code source de l’installation, que l’AGPL oblige à proposer aux personnes qui l’utilisent.
  """
  codeSource: String!
  faviconUrl: String
  iconeApplicationUrl: String
  logoUrl: String

  """
  Adresse du manifest de l’application installée, propre à l’organisation (ADR 0023).
  """
  manifestUrl: String!

  """
  Adresse de la liste des modes d’emploi de l’espace organisateur, un par rôle.
  """
  modesDEmploi: String!
  nom: String!
  pageEquipe: String
  sigle: String
  slug: String!

  """
  Lien du bouton « Support » : l’adresse de support de l’organisation en mailto:, sinon l’action de l’hébergeur, sinon rien.
  """
  support: String
  theme: Theme!
}

"""Une organisation dont la personne connectée est membre, avec son rôle."""
type OrganisationDeLaPersonne {
  """Vrai pour l’organisation active de la requête."""
  active: Boolean!
  estAdmin: Boolean!
  nom: String!
  sigle: String
  slug: String!
  statut: String!
}

"""
Une organisation vue par l’administration de l’installation : identité, statut, limites et compteurs, sans aucune donnée de ses membres.
"""
type OrganisationInstallation {
  activites: [ActiviteInstallation!]!
  creeLe: DateTime!
  limites: LimitesOrganisation!
  nom: String!
  nombreMembres: Int!
  slug: String!
  statut: StatutOrganisation!
}

"""
Chemin du partage d’une fiche vers un périmètre : sa liste « Concerne aussi », un groupe de cette liste, ou une déclinaison acceptée qui cite la fiche.
"""
enum OrigineConnexe {
  DECLINAISON
  GROUPE
  LISTE
}

enum OrigineDemande {
  FORMULAIRE
  PROPOSITION
}

type Perimetre {
  """
  Accès de la personne connectée au périmètre (ADR 0014). COMPLET : elle lit ses tâches et ses fiches. CONSULTATION : elle lit ses tâches, son avancement et son équipe, sans ses fiches. AUCUN : elle ne lit ni ses tâches, ni son avancement, ni son équipe, ni ses fiches. Le nom et la description du périmètre restent lisibles en découverte (ADR 0012).
  """
  acces: AccesPerimetre!
  activite: Activite!
