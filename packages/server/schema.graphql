type Activite {
  archive: Boolean!
  contactRecrutement: String
  estAdministree: Boolean!
  groupes: [GroupePerimetres!]!
  id: ID!
  identite: IdentiteActivite!

  """Le logo de l’activité, sinon celui de l’organisation."""
  logoUrl: String
  nature: NatureActivite!
  nom: String!
  ordre: Int!
  pageEquipe: String
  sigle: String
  slug: String!

  """
  Le thème de l’organisation, dont l’activité surcharge les couleurs et le fond.
  """
  theme: Theme!
}

type ActiviteInstallation {
  archive: Boolean!
  nature: String!
  nom: String!

  """Périodes non archivées, celles que compte la limite."""
  periodesOuvertes: [PeriodeInstallation!]!
  slug: String!
}

type Affectation {
  creeLe: DateTime!
  edition: Edition!
  id: ID!
  perimetre: Perimetre!
  personne: Personne!
}

"""
Dossier de contenu de l’organisation, en archive zip encodée en base64. Il ne contient aucune donnée personnelle.
"""
type ArchiveContenu {
  donnees: String!
  nomFichier: String!
}

type Avancement {
  aFaire: Int!
  abandonnees: Int!
  enCours: Int!
  enRetard: Int!
  faites: Int!
  sansPersonne: Int!
  total: Int!
}

type AvancementPerimetre {
  avancement: Avancement!
  perimetre: Perimetre!
}

type BaremeScore {
  bonusATemps: Int!
  ficheCreee: Int!
  ficheModifiee: Int!
  tacheCreee: Int!
  tacheRealisee: Int!
}

type CouleursTheme {
  accent: String!
  accentClair: String!
  alerte: String!
  alerteClair: String!
  encre: String!
  erreur: String!
  erreurClair: String!
  primaire: String!
  primaireClair: String!
  sol1: String!
  sol2: String!
  sol3: String!
  succes: String!
  succesClair: String!
}

"""
A date string, such as 2007-12-03, compliant with the `full-date` format outlined in section 5.6 of the RFC 3339 profile of the ISO 8601 standard for representation of dates and times using the Gregorian calendar.
"""
scalar Date

"""
A date-time string at UTC, such as 2007-12-03T10:15:30Z, compliant with the `date-time` format outlined in section 5.6 of the RFC 3339 profile of the ISO 8601 standard for representation of dates and times using the Gregorian calendar.
"""
scalar DateTime

type DroitRedaction {
  accordeLe: DateTime!
  id: ID!
  perimetre: Perimetre
  personne: Personne!
}

type Edition {
  activite: Activite!
  annee: Int!
  debut: Date!
  fin: Date!
  id: ID!
  nom: String!
  statut: StatutEdition!
}

enum EtatPostes {
  COMPLET
  INCOMPLET
  SANS_PERSONNE
}

type Fiche {
  activite: Activite!
  archive: Boolean!
  contenu: String!
  donneesPersonnelles: [String!]!
  id: ID!
  modifieeLe: DateTime!
  modifieePar: String
  nombreVersions: Int
  perimetre: Perimetre
  peutModifier: Boolean!
  slug: String!
  source: SourceFiche
  taches(editionId: ID!): [Tache!]!
  titre: String!
  versionCouranteId: ID
  versions: [FicheVersion!]!
}

type FicheVersion {
  auteur: Personne
  contenu: String!
  creeLe: DateTime!
  id: ID!
  resume: String
  source: SourceFiche!
  titre: String!
}

"""Le fond du thème, en plus des trois arrêts du sol."""
type FondTheme {
  halo1: HaloTheme!
  halo2: HaloTheme!

  """L’arrêt à 18 % du dégradé du sol, entre sol1 et sol2."""
  transition: String!
}

enum FormatMedia {
  PNG
  SVG
}

enum FrequenceResume {
  AUCUN
  HEBDOMADAIRE
  QUOTIDIEN
}

"""Catégorie de périmètres déclarée par une activité."""
type GroupePerimetres {
  cle: String!
  libelle: String!
  libellePluriel: String!
}

input GroupePerimetresInput {
  cle: String!
  libelle: String!
  libellePluriel: String!
}

"""Une tache de couleur floue derrière le verre."""
type HaloTheme {
  couleur: String!

  """Opacité, de 0 à 0,35."""
  intensite: Float!
}

"""
Identité propre d’une activité. Chaque champ absent reprend la valeur de l’organisation.
"""
type IdentiteActivite {
  contactRecrutement: String
  logoPng: String
  logoSvg: String
  logoUrl: String
  pageEquipe: String

  """Couleurs et fond qui surchargent le thème de l’organisation."""
  theme: JSONObject
}

"""
Identité de l’organisation telle que ses admins la déclarent. Réservée aux admins.
"""
type IdentiteOrganisation {
  """
  Adresses de rôle hébergées chez une messagerie grand public, autorisées une par une.
  """
  adressesRoleAutorisees: [String!]!
  contactRecrutement: String
  contenuModifieLe: DateTime
  contenuSynchroniseLe: DateTime

  """
  Domaines des adresses de rôle. Une adresse de ces domaines passe pour institutionnelle. Ils ne limitent pas les invitations.
  """
  domainesCourrielAutorises: [String!]!
  favicon: String
  faviconUrl: String
  logoPng: String
  logoSvg: String
  logoUrl: String
  nom: String!
  pageEquipe: String
  sigle: String
  slug: String!

  """
  Thème déclaré, partiel : le thème par défaut complète les valeurs absentes.
  """
  theme: JSONObject
}

"""
The `JSONObject` scalar type represents JSON objects as specified by [ECMA-404](http://www.ecma-international.org/publications/files/ECMA-ST/ECMA-404.pdf).
"""
scalar JSONObject @specifiedBy(url: "http://www.ecma-international.org/publications/files/ECMA-ST/ECMA-404.pdf")

type LigneClassement {
  personne: Personne!
  rang: Int!
  score: Score!
}

"""
Plafonds d’une organisation. Un champ nul signifie aucune limite. Une limite bloque une création, jamais la lecture ni l’export.
"""
type LimitesOrganisation {
  activites: Int
  periodesOuvertes: Int
}

"""
Une valeur nulle retire la limite ; un champ absent la laisse telle quelle.
"""
input LimitesOrganisationInput {
  activites: Int
  periodesOuvertes: Int
}

"""Image enregistrée pour l’organisation, désignée par son empreinte."""
type MediaTeleverse {
  empreinte: String!
  url: String!
}

type Mutation {
  accorderDroitRedaction(perimetreId: ID, personneId: ID!): DroitRedaction!
  affecter(editionId: ID!, perimetreId: ID!, personneId: ID!): Affectation!
  archiverActivite(archive: Boolean!, id: ID!): Activite!
  archiverFiche(archive: Boolean!, id: ID!): Fiche!
  archiverPersonne(archive: Boolean!, id: ID!): Personne!
  assignerTache(assigne: Boolean!, id: ID!, personneId: ID): Tache!
  changerStatutTache(confirmer: Boolean = false, id: ID!, realiseeParId: ID, statut: StatutTache!): Tache!
  creerActivite(groupes: [GroupePerimetresInput!], nature: NatureActivite!, nom: String!, ordre: Int = 0, sigle: String, slug: String!): Activite!
  creerEdition(activiteId: ID, annee: Int!, debut: Date!, fin: Date!, nom: String!): Edition!
  creerFiche(activiteId: ID, contenu: String!, perimetreId: ID, slug: String!, titre: String!): Fiche!
  creerOrganisation(domainesCourrielAutorises: [String!], fuseauHoraire: String, limites: LimitesOrganisationInput, nom: String!, sigle: String, slug: String!): OrganisationInstallation!
  creerPerimetre(activiteId: ID, couleur: String, groupe: String, nom: String!, ordre: Int = 0, slug: String!, type: TypePerimetre): Perimetre!
  creerTache(description: String, echeance: Date, editionId: ID!, ficheId: ID, mAssigner: Boolean = false, perimetreId: ID!, titre: String!): Tache!
  definirAdminActivite(activiteId: ID!, admin: Boolean!, personneId: ID!): Boolean!
  definirEffectif(editionId: ID!, effectif: Int!, perimetreId: ID!): Int!

  """Remplace l’ensemble des souhaits d’une personne pour une édition."""
  definirSouhaits(editionId: ID!, perimetreIds: [ID!]!, personneId: ID!): [Souhait!]!

  """
  Écrit l’export complet d’une organisation dans le dossier EXPORTS_DIR du serveur et renvoie le nom du fichier. Le contenu ne transite jamais par l’API.
  """
  demanderExport(organisation: String!): String!
  inviterPersonne(editionId: ID, email: String!, estAdmin: Boolean = false, nom: String!, perimetresSouhaites: [ID!]): Personne!

  """
  Donne le rôle d’admin d’une organisation à une adresse et lui envoie une invitation. La réponse ne renvoie aucune donnée du compte.
  """
  inviterPremierAdmin(email: String!, nom: String!, organisation: String!): Boolean!

  """Sans identifiants, marque toutes les notifications comme lues."""
  marquerNotificationsLues(ids: [ID!]): Int!
  modifierActivite(archive: Boolean, groupes: [GroupePerimetresInput!]!, id: ID!, nature: NatureActivite!, nom: String!, ordre: Int!, sigle: String): Activite!
  modifierEdition(debut: Date!, fin: Date!, id: ID!, nom: String!, statut: StatutEdition!): Edition!
  modifierFiche(contenu: String!, id: ID!, resume: String, titre: String!): Fiche!

  """
  Remplace l’identité propre d’une activité. Un champ vide reprend la valeur de l’organisation.
  """
  modifierIdentiteActivite(contactRecrutement: String, id: ID!, logoPng: String, logoSvg: String, pageEquipe: String, theme: JSONObject): Activite!

  """
  Remplace l’identité de l’organisation. Le slug, le fuseau horaire, le statut et les limites ne changent pas ici.
  """
  modifierIdentiteOrganisation(adressesRoleAutorisees: [String!]!, contactRecrutement: String, domainesCourrielAutorises: [String!]!, favicon: String, logoPng: String, logoSvg: String, nom: String!, pageEquipe: String, sigle: String, theme: JSONObject): IdentiteOrganisation!
  modifierOrganisationInstallation(limites: LimitesOrganisationInput, slug: String!, statut: StatutOrganisation): OrganisationInstallation!
  modifierPerimetre(archive: Boolean!, couleur: String, groupe: String, id: ID!, nom: String!, ordre: Int!, type: TypePerimetre): Perimetre!
  modifierPersonne(estAdmin: Boolean!, id: ID!, nom: String!): Personne!
  modifierPreferencesNotification(frequenceResume: FrequenceResume!, mailEcheance: Boolean!, mailModification: Boolean!): PreferencesNotification!
  modifierTache(confirmer: Boolean = false, description: String, echeance: Date, ficheId: ID, id: ID!, titre: String!): Tache!
  renvoyerInvitation(id: ID!): Boolean!
  restaurerVersionFiche(versionId: ID!): Fiche!
  retirerAffectation(id: ID!): Boolean!
  retirerDroitRedaction(id: ID!): Boolean!
  retirerSouhait(id: ID!): Boolean!

  """
  Enregistre une image de l’organisation : PNG de 512 Ko au plus, ou SVG de 128 Ko au plus, sans script.
  """
  televerserMedia(donnees: String!, format: FormatMedia!): MediaTeleverse!
}

"""
Fixe le libellé de la période : édition pour un événement, saison pour une section, mandat pour une instance.
"""
enum NatureActivite {
  EVENEMENT
  MANDAT
  SAISON
}

type Notification {
  creeLe: DateTime!
  id: ID!
  lien: String!
  lue: Boolean!
  message: String!
  type: TypeNotification!
}

"""Identité publique de l’organisation qui utilise cette installation."""
type Organisation {
  """
  Adresse du code source de l’installation, que l’AGPL oblige à proposer aux personnes qui l’utilisent.
  """
  codeSource: String!
  faviconUrl: String
  logoUrl: String
  nom: String!
  pageEquipe: String
  sigle: String
  slug: String!
  theme: Theme!
}

"""Une organisation dont la personne connectée est membre, avec son rôle."""
type OrganisationDeLaPersonne {
  """Vrai pour l’organisation active de la requête."""
  active: Boolean!
  estAdmin: Boolean!
  nom: String!
  sigle: String
  slug: String!
  statut: String!
}

"""
Une organisation vue par l’administration de l’installation : identité, statut, limites et compteurs, sans aucune donnée de ses membres.
"""
type OrganisationInstallation {
  activites: [ActiviteInstallation!]!
  creeLe: DateTime!
  limites: LimitesOrganisation!
  nom: String!
  nombreMembres: Int!
  slug: String!
  statut: StatutOrganisation!
}

type Perimetre {
  activite: Activite!
  archive: Boolean!
  avancement(editionId: ID!): Avancement!
  couleur: String
  fiches: [Fiche!]!
  groupe: String!
  id: ID!
  nom: String!
  ordre: Int!
  peutModifier(editionId: ID!): Boolean!
  peutRedigerFiches: Boolean!
  referents(editionId: ID!): [Personne!]!
  slug: String!
  taches(editionId: ID!): [Tache!]!
  type: TypePerimetre!
}

type PeriodeInstallation {
  annee: Int!
  debut: Date!
  fin: Date!
  nom: String!
  statut: String!
}

type Personne {
  activitesAdministrees: [ID!]!
  affectations(editionId: ID): [Affectation!]!
  archive: Boolean!
  creeLe: DateTime!
  email: String!
  estAdmin: Boolean
  id: ID!
  nom: String!
  souhaits(editionId: ID): [Souhait!]!
}

"""
Une personne trouvée par la recherche, avec les périmètres lisibles où elle est affectée.
"""
type PersonneTrouvee {
  id: ID!
  nom: String!
  perimetres: [Perimetre!]!
}

"""Piles CSS complètes, prêtes pour font-family."""
type PolicesTheme {
  mono: String!
  texte: String!
  titre: String!
}

type PostesPerimetre {
  aPourvoir: Int!
  affectations: [Affectation!]!

  """
  Vaut null tant que l’effectif n’a été ni importé ni défini pour cette édition.
  """
  effectif: Int
  etat: EtatPostes!
  perimetre: Perimetre!

  """
  Souhaits en attente : la personne n’est pas encore affectée à ce périmètre. Les comptes archivés sont exclus.
  """
  souhaits: [Souhait!]!
}

type PreferencesNotification {
  frequenceResume: FrequenceResume!
  mailEcheance: Boolean!
  mailModification: Boolean!
}

type Query {
  activites(inclureArchives: Boolean = false): [Activite!]!
  affectations(editionId: ID!): [Affectation!]!

  """
  Message à diffuser pour trouver des référentes et des référents. Vaut null quand aucun périmètre n’est à pourvoir.
  """
  appelPostes(editionId: ID!): String
  avancementGlobal(editionId: ID!): [AvancementPerimetre!]!
  baremeScore: BaremeScore!
  classement(editionId: ID!): [LigneClassement!]!
  droitsRedaction: [DroitRedaction!]!
  editionCourante(activiteId: ID): Edition
  editions(activiteId: ID): [Edition!]!
  exportContenu: ArchiveContenu!
  fiche(activiteId: ID, slug: String!): Fiche
  fiches(activiteId: ID, inclureArchives: Boolean = false): [Fiche!]!
  health: String!
  identiteOrganisation: IdentiteOrganisation!
  mesOrganisations: [OrganisationDeLaPersonne!]!
  mesPerimetres(activiteId: ID): [Perimetre!]!
  mesPreferencesNotification: PreferencesNotification!
  mesTaches(editionId: ID!): [Tache!]!
  moi: Personne
  monScore(editionId: ID!): Score!
  nombreNotificationsNonLues: Int!
  notifications(limite: Int = 30, nonLuesSeulement: Boolean = false): [Notification!]!

  """
  Nom, sigle et thème de l’organisation active. Sans session : l’organisation désignée par son slug, sinon l’unique organisation de l’installation, sinon une identité neutre. Lisible sans session.
  """
  organisation(slug: String): Organisation!
  organisations: [OrganisationInstallation!]!
  perimetre(activiteId: ID, slug: String!): Perimetre
  perimetres(activiteId: ID, inclureArchives: Boolean = false): [Perimetre!]!
  personnes(inclureArchives: Boolean = false): [Personne!]!
  peutRedigerFichesCommunes(activiteId: ID): Boolean!
  postesAPourvoir(editionId: ID!): [PostesPerimetre!]!
  recherche(editionId: ID, texte: String!): Recherche!
  retroplanning(editionId: ID!): [Tache!]!
  tachesAPrendre(editionId: ID!): [Tache!]!
}

type Recherche {
  fiches: [Fiche!]!
  personnes: [PersonneTrouvee!]!
  taches: [Tache!]!
}

type Score {
  fichesCreees: Int!
  fichesModifiees: Int!
  points: Int!
  tachesATemps: Int!
  tachesCreees: Int!
  tachesRealisees: Int!
}

type Souhait {
  creeLe: DateTime!
  edition: Edition!
  id: ID!
  perimetre: Perimetre!
  personne: Personne!

  """
  Vaut vrai quand la personne est affectée à ce périmètre pour cette édition.
  """
  satisfait: Boolean!
}

enum SourceFiche {
  APP
  GIT
}

enum StatutEdition {
  ARCHIVEE
  EN_COURS
  PREPARATION
}

"""
ACTIVE : tout est permis. LECTURE_SEULE : les membres lisent, personne n’écrit. SUSPENDUE et ARCHIVEE : plus aucun accès.
"""
enum StatutOrganisation {
  ACTIVE
  ARCHIVEE
  LECTURE_SEULE
  SUSPENDUE
}

enum StatutTache {
  ABANDONNEE
  A_FAIRE
  EN_COURS
  FAITE
}

type Tache {
  assignes: [Personne!]!
  clotureePar: Personne
  creeLe: DateTime!
  description: String
  echeance: Date
  edition: Edition!
  enRetard: Boolean!
  fiche: Fiche
  id: ID!
  modifieeLe: DateTime!
  perimetre: Perimetre!
  peutModifier: Boolean!
  realiseePar: Personne
  statut: StatutTache!
  termineeLe: DateTime
  titre: String!
}

"""
Le thème complet de l’organisation, fusionné avec le thème par défaut de Relaytour.
"""
type Theme {
  couleurs: CouleursTheme!
  fond: FondTheme!
  polices: PolicesTheme!
  typographie: TypographieTheme!
}

enum TypeNotification {
  ECHEANCE_PROCHE
  TACHE_ASSIGNEE
  TACHE_CREEE
  TACHE_DESASSIGNEE
  TACHE_EN_RETARD
  TACHE_MODIFIEE
}

enum TypePerimetre {
  POLE
  SPORT
}

type TypographieTheme {
  echelleTitre: Float!
  espacementTitre: String!
  graisseCorps: Int!
  graisseTitre: Int!
}
