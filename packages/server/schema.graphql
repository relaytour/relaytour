}

"""Une séquence du programme du jour J (ADR 0040)."""
type Sequence {
  """
  Le nombre de renforts recherchés ; null si la séquence ne cherche personne (ADR 0041).
  """
  besoinBenevoles: Int

  """Le texte public pour les bénévoles."""
  consignesBenevoles: String
  debut: DateTime!
  description: String
  editionId: ID!
  fin: DateTime!
  heureDebut: String!
  heureFin: String!
  id: ID!
  jour: String!
  jourFin: String!
  lieu: Lieu
  perimetre: Perimetre
  peutModifier: Boolean!
  places: [PlaceSequence!]!

  """
  Les places en renfort, confirmées ou non : elles comptent dans le besoin.
  """
  renforts: Int!
  titre: String!
  version: Int!
}

"""
Une séquence qui cherche des bénévoles, telle que la page publique la montre.
"""
type SequencePublique {
  """
  Vrai quand le besoin est atteint : une candidature passe en liste d’attente.
  """
  complete: Boolean!

  """
  Vaut null sans consignes, ou si elles contiennent une coordonnée personnelle.
  """
  consignes: String
  couleur: String
  heureDebut: String!
  heureFin: String!
  jour: String!
  jourFin: String!
  lieu: String

  """
  Vaut null sans description, ou si elle contient une coordonnée personnelle.
  """
  lieuDescription: String
  perimetre: String
  placesRecherchees: Int!

  """La référence de la séquence dans cet appel."""
  ref: String!
  titre: String!
}

"""
Un sondage de dates de l’agenda global d’une activité, ou de l’agenda d’un périmètre.
"""
type Sondage {
  """Vrai si la personne connectée a répondu à chaque créneau."""
  aRepondu: Boolean!
  cible: CibleConvocation!
  creneaux: [CreneauSondage!]!
  description: String
  editionId: ID!
  estParticipant: Boolean!
  id: ID!

  """
  Les personnes visées, pour les personnes qui écrivent dans l’agenda : la réunion créée depuis le sondage les convoque. Nul sinon.
  """
  participantIds: [ID!]

  """Le nombre de personnes visées."""
  participants: Int!
  perimetre: Perimetre
  peutModifier: Boolean!

  """Le nombre de personnes qui ont répondu à au moins un créneau."""
  repondants: Int!

  """La réunion créée depuis le sondage clos."""
  reunionId: ID
  statut: StatutSondage!
  titre: String!
  version: Int!
}

