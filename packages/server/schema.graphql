"""
Un abonnement à l’agenda. Son adresse ne se relit pas : elle s’affiche une seule fois, à sa création.
"""
type AbonnementAgenda {
  creeLe: DateTime!

  """La dernière lecture par un agenda, à une heure près."""
  dernierAccesLe: DateTime

  """Les derniers caractères de l’adresse, pour la reconnaître."""
  fin: String!
  id: ID!
  inclureEcheances: Boolean!
  inclureGlobal: Boolean!

  """Les périmètres choisis. Nul : tous les périmètres que la personne lit."""
  perimetreIds: [ID!]
  sorte: SorteAbonnement!
}

enum AccesActivite {
  COMPLET
  DECOUVERTE
}

"""
Comment Relaytour propose les accès d’un dossier lié chez le fournisseur : rien, un partage du dossier, ou l’entrée dans un groupe (ADR 0044).
"""
enum AccesFournisseurDossier {
  AUCUN
  GROUPE
  PARTAGE
}

enum AccesPerimetre {
  AUCUN
  COMPLET
  CONSULTATION
}

"""
Accord du périmètre cible sur une déclinaison. EN_ATTENTE : la déclinaison est proposée et ne compte pas encore parmi les tâches du périmètre.
"""
enum AccordDeclinaison {
  ACCEPTE
  EN_ATTENTE
  REFUSE
}

enum ActionProposition {
  AJOUTER
  RETIRER
}

type Activite {
  acces: AccesActivite!
  adressesOrganigramme: AdressesOrganigramme!
  archive: Boolean!
  contactRecrutement: String
  estAdministree: Boolean!
  formulaire: Formulaire!

  """
  Vrai quand le formulaire public de l’activité accepte des demandes (ADR 0015).
  """
  formulaireOuvert: Boolean!
  groupes: [GroupePerimetres!]!
  id: ID!
  identite: IdentiteActivite!

  """Le logo de l’activité, sinon celui de l’organisation."""
  logoUrl: String
  nature: NatureActivite!
  nom: String!
  ordre: Int!
  pageEquipe: String

  """
  Les phases de l’activité, dans l’ordre : celles qu’elle déclare, sinon les phases par défaut (ADR 0025).
  """
  phases: [Phase!]!
  sigle: String
  slug: String!

  """
  Vrai quand tous les membres de l’organisation découvrent les périmètres de l’activité et formulent leurs souhaits (ADR 0012).
  """
  souhaitsOuverts: Boolean!

  """
  Le thème de l’organisation, dont l’activité surcharge les couleurs et le fond.
  """
  theme: Theme!
}

type ActiviteInstallation {
  archive: Boolean!
  nature: String!
  nom: String!

  """Périodes non archivées, celles que compte la limite."""
  periodesOuvertes: [PeriodeInstallation!]!
  slug: String!
}

"""
L’activité d’une notification, pour la ranger et l’afficher (ADR 0032).
"""
type ActiviteNotifiee {
  id: ID!
  nom: String!
  slug: String!
}

"""
TOTALE : une plage couvre toute la séquence. PARTIELLE : une plage en couvre une partie. AUCUNE : aucune plage ne la touche.
"""
enum Adequation {
  AUCUNE
  PARTIELLE
  TOTALE
}

type AdresseAbonnement {
  abonnement: AbonnementAgenda!

  """L’adresse complète, affichée une seule fois."""
  adresse: String!
}

"""
Adresses personnelles que l’organigramme d’une activité peut afficher, avec l’accord de chaque personne (ADR 0036).
"""
enum AdressesOrganigramme {
  AUCUNE
  CONTACTS
  REFERENTS
}

type Affectation {
  """
  Vrai pour le contact principal du périmètre et de l’édition : une information, sans droit supplémentaire (ADR 0011).
  """
  contactPrincipal: Boolean!
  creeLe: DateTime!
  edition: Edition!
  id: ID!
  perimetre: Perimetre!
  personne: Personne!
}

type Agenda {
  edition: Edition!

  """Les éléments, par premier jour puis par sorte."""
  elements: [ElementAgenda!]!

  """
  Vrai pour un admin de l’activité, tant que la période n’est pas archivée : il écrit les dates clés.
  """
  peutGerer: Boolean!
}

"""
Un appel à bénévoles : une adresse publique ouverte entre deux dates (ADR 0041).
"""
type AppelBenevoles {
  """
  L’adresse publique, recalculée à la demande pour les personnes qui gèrent l’appel ; null sinon.
  """
  adresse: String
  candidaturesEnAttente: Int!
  editionId: ID!
  etat: EtatAppel!
  fermeLe: DateTime!

  """
  Les derniers caractères du jeton, pour reconnaître l’adresse d’un coup d’œil.
  """
  finAdresse: String!
  id: ID!
  introduction: String
  nom: String!
  ouvertLe: DateTime!
  perimetre: Perimetre
  peutModifier: Boolean!
  portee: PorteeAppel!

  """
  Vrai pour un appel d’import (ADR 0042) : il n’a pas d’adresse publique et reste fermé.
  """
  sansAdresse: Boolean!
  sequenceId: ID
  sequenceTitre: String

  """La source d’un appel d’import."""
  sourceImport: String
  version: Int!
}

"""
La page publique d’un appel à bénévoles (ADR 0041). Lisible sans session.
"""
type AppelBenevolesPublic {
  activite: String!

  """
  Adresse de rôle à laquelle demander l’accès à ses données ou leur suppression.
  """
  contact: String!
  introduction: String

  """Les jours où une plage de disponibilité peut tomber."""
  jours: [String!]!
  organisation: String!

  """
  Vrai : la personne peut proposer son aide là où il manque du monde, sans choisir de séquence.
  """
  ouAilleurs: Boolean!
  periode: String!
  sequences: [SequencePublique!]!
}

type AppelEtAdresse {
  """L’adresse publique de l’appel."""
  adresse: String!
  appel: AppelBenevoles!
}

"""
Dossier de contenu de l’organisation, en archive zip encodée en base64. Il ne contient aucune donnée personnelle.
"""
type ArchiveContenu {
  donnees: String!
  nomFichier: String!
}

"""
Les personnes qu’un dossier lié attend chez le fournisseur : tous les membres de la période, ou les contacts principaux seulement (ADR 0044).
"""
enum AttendusDossier {
  CONTACTS_PRINCIPAUX
  MEMBRES
}

"""
Le lien d’une personne avec une activité de l’organisation, toutes périodes confondues (ADR 0018).
"""
type AttributionActivite {
  activiteId: ID!

  """Vrai quand la personne administre l’activité."""
  admin: Boolean!

  """Vrai quand la personne y a au moins une affectation."""
  affectee: Boolean!

  """Vrai quand la personne y a au moins un souhait."""
  interessee: Boolean!

  """
  Vrai quand la personne est rattachée à l’activité (ADR 0045). Toute affectation la rattache aussi.
  """
  rattachee: Boolean!
}

type Avancement {
  aFaire: Int!
  abandonnees: Int!
  enCours: Int!
  enRetard: Int!
  faites: Int!
  sansPersonne: Int!
  total: Int!
}

type AvancementPerimetre {
  avancement: Avancement!
  perimetre: Perimetre!
}

type BaremeScore {
  bonusATemps: Int!
  ficheCreee: Int!
  ficheModifiee: Int!
  tacheCreee: Int!
  tacheRealisee: Int!
}

"""Une fiche bénévole : une personne qui aide sans compte."""
type Benevole {
  accordLe: DateTime!

  """
  La date à laquelle la personne a confirmé sa participation depuis son lien.
  """
  confirmeeLe: DateTime

  """Vrai si la personne connectée lit l’adresse, le téléphone et la note."""
  coordonneesVisibles: Boolean!
  courriel: String
  id: ID!
  lienEnvoyeLe: DateTime

  """
  Le lien personnel, à copier, pour une personne qui lit les coordonnées ; null sans lien ou sans ce droit.
  """
  lienEspace: String

  """
  Vrai quand la personne connectée peut renvoyer le lien par mail, vers une fiche joignable : le lien est parti une fois sans relance, ou la fiche placée n’a pas pu recevoir son premier mail.
  """
  lienRenvoyable: Boolean!
  nom: String!
  note: String

  """
  SAISIE : saisie par l’équipe. CANDIDATURE : née d’une candidature (ADR 0041). IMPORT : née d’un import de liste (ADR 0042).
  """
  origine: String!
  peutModifier: Boolean!

  """Le nombre de séquences où la fiche est placée."""
  places: Int!

  """
  Les précisions de disponibilité de la personne, distinctes de la note (ADR 0042). Elles se lisent comme ses plages.
  """
  precisionsDisponibilite: String

  """
  L’option « Prévenir par mail ». Avec une adresse, la fiche est joignable : sa première place envoie le lien (ADR 0041).
  """
  prevenirParMail: Boolean!

  """La source de l’import qui a créé la fiche."""
  sourceImport: String
  telephone: String
}

"""
Une personne disponible : une candidature en attente, ou une fiche qui a des plages de disponibilité. Elle se lit sans adresse ni téléphone.
"""
type BenevoleARepartir {
  """Pour la séquence demandée, s’il y en a une."""
  adequation: Adequation
  benevoleId: ID
  candidatureId: ID
  choix: [ChoixARepartir!]!
  cle: String!
  message: String
  nom: String!

  """
  La note de la fiche, pour une personne qui lit ses coordonnées (ADR 0040).
  """
  note: String

  """Le nom de l’appel, pour une candidature."""
  origine: String
  ouAilleurs: Boolean!
  places: [PlaceTenue!]!
  plages: [PlageDisponibilite!]!
  precisionsDisponibilite: String
}

"""
Le dépôt d’une personne sur un appel à bénévoles (ADR 0041). Il se lit par les personnes qui peuvent le traiter.
"""
type Candidature {
  accordLe: DateTime!
  appelId: ID!
  appelNom: String!
  benevoleId: ID
  choix: [ChoixCandidature!]!
  courriel: String
  deposeeLe: DateTime!
  id: ID!
  message: String
  nom: String!

  """
  PUBLIC : déposée sur la page d’un appel. IMPORT : venue d’un import de liste (ADR 0042).
  """
  origine: String!

  """
  Vrai : la personne aide là où il manque du monde, sans choisir de séquence.
  """
  ouAilleurs: Boolean!

  """
  Vrai si la personne gère l’appel : elle refuse alors toute la candidature.
  """
  peutEcarter: Boolean!
  plages: [PlageDisponibilite!]!
  precisionsDisponibilite: String
  sourceImport: String
  statut: StatutCandidature!
  telephone: String
}

"""
Le champ de la messagerie qui reçoit les destinataires : « À » pour une seule personne, « Cc » (adresses visibles) ou « Cci » (adresses cachées).
"""
enum ChampDestinataires {
  A
  CC
  CCI
}

"""
Signal qu’une chose a changé dans l’organisation active. Il ne porte aucune donnée : le client relit ses écrans.
"""
type Changement {
  activiteId: ID
  editionId: ID
  entite: EntiteChangee!
  id: ID
  perimetreId: ID
}

type ChoixARepartir {
  sequenceId: ID!
  statut: String!
}

"""Une séquence choisie dans une candidature."""
type ChoixCandidature {
  debut: DateTime!
  fin: DateTime!
  heureDebut: String!
  heureFin: String!
  id: ID!
  jour: String!
  jourFin: String!
  lieu: String
  perimetre: Perimetre
  peutTraiter: Boolean!
  sequenceId: ID!
  statut: StatutChoix!
  titre: String!
  traiteLe: DateTime
}

enum ChoixSondage {
  NON
  OUI
  SI_BESOIN
}

"""
Les personnes convoquées : tout le périmètre, toute l’équipe de l’activité, ou des personnes choisies dans l’équipe.
"""
enum CibleConvocation {
  CHOIX
  EQUIPE
  PERIMETRE
}

"""
Un commentaire écrit sur une tâche : un texte simple, daté et signé (ADR 0029).
"""
type CommentaireTache {
  """Null quand le compte de l’auteur n’existe plus."""
  auteur: Personne
  creeLe: DateTime!
  id: ID!

  """
  Le moment de la dernière modification du texte par son auteur, ou null.
  """
  modifieLe: DateTime

  """Vrai pour l’auteur, tant qu’il écrit dans le périmètre."""
  peutModifier: Boolean!

  """
  Vrai pour l’auteur et pour les admins de l’activité, tant que la période n’est pas archivée.
  """
  peutSupprimer: Boolean!
  texte: String!
}

"""
Les commentaires d’une période, pour une liste de tâches : où la personne lit les fils, et combien de commentaires porte chaque tâche.
"""
type CommentairesPeriode {
  """Une tâche sans commentaire est absente."""
  nombres: [NombreCommentaires!]!

  """Les périmètres de l’activité dont la personne lit les fils."""
  perimetresLus: [ID!]!
}

"""
Le compte d’un membre chez le fournisseur. Un état nul : la personne n’a pas encore été cherchée.
"""
type CompteFournisseurVue {
  adresseSaisie: String
  etat: EtatCompteFournisseur
  personne: PersonneAcces!
  verifieLe: DateTime
}

type ConflitImport {
  fiche: String!
  raison: String!
}

"""
Un périmètre qu’une fiche concerne, avec le chemin du partage et son masquage.
"""
type ConnexionFiche {
  groupe: String
  masquee: Boolean!
  par: OrigineConnexe!
  perimetre: Perimetre!
  tacheId: ID
}

"""
Connexion de l’organisation à son espace de fichiers. Le jeton ne sort jamais du serveur.
"""
type ConnexionFichiers {
  accesErreur: String

  """Dernière vérification des accès chez le fournisseur."""
  accesVerifieLe: DateTime
  compte: String!
  connecteeLe: DateTime!
  connecteePar: String
  etat: EtatConnexionFichiers!

  """
  Chemin du dossier où Relaytour exporte les fiches. Null : aucun export.
  """
  exportDossier: String
  exportRapport: RapportExport
  fournisseur: FournisseurFichiers!
  methode: MethodeConnexionFichiers!
  portee: PorteeConnexionFichiers!
}

"""Une façon de connecter l’espace de fichiers, ouverte par l’exploitant."""
type ConnexionPossible {
  fournisseur: FournisseurFichiers!
  methode: MethodeConnexionFichiers!
}

type ConvocationLue {
  """Vrai quand le mail de convocation est parti."""
  envoyee: Boolean!
  nom: String!
  personneId: ID!
  reponse: ReponseConvocation
}

"""
Une association enregistrée des colonnes d’un fichier aux champs de Relaytour. Elle ne contient aucune donnée personnelle.
"""
type CorrespondanceImport {
  associations: JSONObject!
  entetes: [String!]!
  id: ID!
  modifieeLe: DateTime!
  nom: String!
  peutSupprimer: Boolean!
  reglages: JSONObject!
}

"""La fiche dont une valeur est gardée."""
enum CoteFusion {
  AUTRE
  GARDEE
}

type CouleursTheme {
  accent: String!
  accentClair: String!
  alerte: String!
  alerteClair: String!
  encre: String!
  erreur: String!
  erreurClair: String!
  primaire: String!
  primaireClair: String!
  sol1: String!
  sol2: String!
  sol3: String!
  succes: String!
  succesClair: String!
}

type CreneauSondage {
  """HH:MM, dans le fuseau de l’organisation."""
  heureDebut: String
  heureFin: String
  id: ID!

  """AAAA-MM-JJ."""
  jour: String!
  monChoix: ChoixSondage
  non: Int!
  oui: Int!

  """
  Les réponses nominatives, lues par les personnes visées et par celles qui écrivent dans l’agenda.
  """
  reponses: [ReponseSondage!]!
  retenu: Boolean!
  siBesoin: Int!
}

input CreneauSondageInput {
  """HH:MM, ou rien."""
  heureDebut: String

  """HH:MM, ou rien."""
  heureFin: String

  """Un créneau existant, pour une modification."""
  id: ID
  jour: Date!
}

"""
A date string, such as 2007-12-03, compliant with the `full-date` format outlined in section 5.6 of the RFC 3339 profile of the ISO 8601 standard for representation of dates and times using the Gregorian calendar.
"""
scalar Date

type DateCle {
  description: String
  id: ID!
  jour: Date!
  jourFin: Date
  titre: String!
  version: Int!
}

"""
A date-time string at UTC, such as 2007-12-03T10:15:30Z, compliant with the `date-time` format outlined in section 5.6 of the RFC 3339 profile of the ISO 8601 standard for representation of dates and times using the Gregorian calendar.
"""
scalar DateTime

"""
Connexion à Nextcloud commencée : la page où l’admin accorde l’accès, et l’état à présenter ensuite.
"""
type DebutConnexionNextcloud {
  connexion: String!
  etat: String!
}

"""
Les périmètres où décliner une tâche partagée. Un texte ou une échéance absents reprennent ceux de la tâche partagée.
"""
input DeclinaisonInput {
  description: String
  echeance: Date
  perimetreIds: [ID!]!
  titre: String
}

type Demande {
  adresse: String!
  creeLe: DateTime!

  """
  Vrai quand un compte que la personne connectée peut lire porte déjà cette adresse : un membre de l’organisation pour un admin de l’organisation, une personne de ses équipes pour un admin d’activité (ADR 0018).
  """
  dejaMembre: Boolean!

  """Palier de disponibilité choisi dans le formulaire public."""
  disponibilite: String
  edition: Edition!
  id: ID!
  nom: String!
  origine: OrigineDemande!
  perimetres: [DemandePerimetre!]!

  """
  Libellé de la question complémentaire au moment du dépôt. Le réglage du formulaire peut avoir changé depuis.
  """
  question: String

  """Réponse à la question complémentaire du formulaire public."""
  reponse: String
  statut: StatutDemande!

  """Texte libre du formulaire public."""
  texte: String
  traiteeLe: DateTime
  traiteePar: Personne
}

type DemandePerimetre {
  id: ID!
  mot: String
  perimetre: Perimetre!
  proposePar: Personne
}

type DepassementImport {
  besoin: Int!
  renforts: Int!
  sequenceId: ID!
  titre: String!
}

"""
Dossier du fournisseur cloud lié à une activité. Il sert toute l’activité, ou une liste de périmètres et de groupes (ADR 0043).
"""
type DossierLie {
  """
  Les accès que Relaytour a créés pour ce dossier chez le fournisseur. Zéro pour une personne qui n’est pas admin de l’organisation.
  """
  accesCrees: Int!
  accesFournisseur: AccesFournisseurDossier!
  activiteId: ID!
  ajoutsAutomatiques: Boolean!
  attendus: AttendusDossier!

  """
  Vrai quand l’espace connecté est actif et vient du même fournisseur que le dossier.
  """
  disponible: Boolean!
  fournisseur: FournisseurFichiers!
  groupeFournisseurId: ID
  groupeFournisseurNom: String

  """
  Les clés des groupes de la liste. Un groupe vaut pour ses périmètres non archivés.
  """
  groupes: [String!]!
  id: ID!
  invitationFournisseur: Boolean!

  """
  Les lecteurs par lesquels la personne lit ce dossier. La vue « Documents » range le dossier sous chacun.
  """
  lecteursLus: LecteursLusDossier!
  nom: String!
  perimetre: Perimetre @deprecated(reason: "Un dossier lié a plusieurs lecteurs : lire touteActivite, perimetres et groupes.")

  """Les périmètres nommés dans la liste des lecteurs."""
  perimetres: [Perimetre!]!
  roleFournisseur: RoleFournisseur!

  """Vrai : le dossier sert toute l’activité."""
  touteActivite: Boolean!
}

"""Deux fiches qui désignent peut-être la même personne."""
type DoublonBenevoles {
  a: Benevole!
  b: Benevole!
  niveau: NiveauRapprochement!
}

type DroitRedaction {
  accordeLe: DateTime!
  id: ID!
  perimetre: Perimetre
  personne: Personne!
}

type Edition {
  activite: Activite!
  annee: Int!
  debut: Date!
  fin: Date!
  id: ID!
  nom: String!
  statut: StatutEdition!
}

"""
Ce que de nouveaux lecteurs changeraient aux documents liés des fiches.
"""
type EffetsLecteursDossier {
  """
  Documents liés que les lecteurs de leur fiche ne liraient plus : la fiche les masquerait.
  """
  documentsMasques: Int!

  """Les fiches qui portent ces documents."""
  fiches: [FicheToucheeParLecteurs!]!
}

"""
Un élément de l’agenda, à champs plats. Les jours s’écrivent au format AAAA-MM-JJ.
"""
type ElementAgenda {
  """Clé stable de l’élément, propre à sa sorte."""
  cle: String!
  dateCleId: ID
  description: String

  """Pour une échéance : vrai si la tâche est faite."""
  faite: Boolean!

  """Premier jour."""
  jour: String!

  """Dernier jour, compris. Nul pour un seul jour."""
  jourFin: String
  perimetreId: ID
  sorte: SorteElementAgenda!
  tacheId: ID
  titre: String!

  """Version d’une date clé, à renvoyer pour la modifier."""
  version: Int
}

"""Dossier ou fichier de l’espace de fichiers."""
type ElementFichiers {
  apercu: FormatApercu!
  dossier: Boolean!
  elementId: String!
  lienWeb: String
  modifieLe: DateTime
  nom: String!
  taille: Float
}

"""
Bibliothèque de documents visible par le compte connecté : son OneDrive, ou la bibliothèque d’un site.
"""
type EmplacementFichiers {
  id: String!
  nom: String!
  site: String
}

"""
Ce qui a changé. EQUIPE couvre les affectations et les souhaits. MESSAGE va aux admins qui lisent le message. AGENDA couvre l’agenda d’une activité (ADR 0037), PROGRAMME ses lieux et ses séquences (ADR 0040). FICHIERS couvre la connexion de l’espace de fichiers et ses dossiers liés (ADR 0038). CANDIDATURE couvre les appels à bénévoles et leurs candidatures (ADR 0041).
"""
enum EntiteChangee {
  AGENDA
  CANDIDATURE
  DEMANDE
  EQUIPE
  FICHE
  FICHIERS
  MESSAGE
  NOTIFICATION
  PERIMETRE
  PROGRAMME
  TACHE
}

"""
L’espace d’une ou d’un bénévole, ouvert par son lien personnel (ADR 0041). Lisible sans session.
"""
type EspaceBenevole {
  activite: String!

  """Vrai quand la personne a confirmé sa participation."""
  confirme: Boolean!
  contact: String

  """Les places à venir au format iCalendar, à télécharger."""
  ics: String!
  nom: String!
  organisation: String!
  places: [PlaceDeLEspace!]!

  """
  Les disponibilités à venir que la personne a données, ou que l’équipe a saisies.
  """
  plages: [PlageDisponibilite!]!
}

type EspaceFichiers {
  connexion: ConnexionFichiers

  """
  Connexions ouvertes par l’exploitant de l’installation. Vide : l’espace de fichiers n’est pas proposé.
  """
  connexionsPossibles: [ConnexionPossible!]!
}

"""
Étape de l’accord d’une déclinaison. IMPOSEE : un admin de l’activité l’a ajoutée sans accord du périmètre.
"""
enum EtapeAccord {
  ACCEPTEE
  IMPOSEE
  PROPOSEE
  REFUSEE
}

"""
