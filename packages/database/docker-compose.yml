name: relaytour

# Services du poste local. Tous les ports sont publiés sur 127.0.0.1 : les règles NAT
# de Docker contournent le pare-feu de l'hôte.
services:
  db:
    # Image taguée : une montée de version majeure silencieuse peut casser le volume.
    image: mariadb:11.8
    container_name: mariadb_relaytour
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: '${MARIADB_ROOT_PASSWORD}'
      MARIADB_DATABASE: '${MARIADB_DATABASE}'
      MARIADB_USER: '${MARIADB_USER}'
      MARIADB_PASSWORD: '${MARIADB_PASSWORD}'
    ports:
      - '127.0.0.1:${MARIADB_PORT:-4410}:3306'
    volumes:
      - dbdata:/var/lib/mysql
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: valkey/valkey:8-alpine
    container_name: redis_relaytour
    restart: unless-stopped
    # noeviction : BullMQ perd des jobs si Redis évince des clés.
    command:
      [
        'valkey-server',
        '--appendonly',
        'yes',
        '--maxmemory-policy',
        'noeviction',
      ]
    ports:
      - '127.0.0.1:${REDIS_PORT:-4411}:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # Mailpit remplace MailDev (non maintenu). Le serveur l'utilise sans variable de
  # bascule : APP_ENV=local sans SMTP renseigné envoie ici.
  mailpit:
    image: axllent/mailpit:v1.27
    container_name: mailpit_relaytour
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: '1'
      MP_SMTP_AUTH_ALLOW_INSECURE: '1'
      MP_MAX_MESSAGES: '500'
    ports:
      - '127.0.0.1:${MAILPIT_SMTP_PORT:-4415}:1025'
      - '127.0.0.1:${MAILPIT_WEB_PORT:-4416}:8025'

  adminer:
    image: adminer
    container_name: adminer_relaytour
    restart: unless-stopped
    ports:
      - '127.0.0.1:${ADMINER_PORT:-4417}:8080'
    profiles: ['outils']

volumes:
  dbdata:
  redisdata:
