# Dependabot ne suit que les actions GitHub : une action épinglée par SHA ne se met pas à jour seule.
# Les dépendances npm restent hors de son périmètre.
# Ses PR visent `develop`, comme toute PR : `main` n'avance qu'à la publication d'une version.
# GitHub lit ce fichier sur la branche par défaut (`main`) : un changement prend effet à la version suivante.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
