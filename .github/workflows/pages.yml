name: Site

# Publie le site de présentation (site/) sur GitHub Pages quand main change ce
# qu'il affiche. Le site est statique : outils/site.mjs l'a déjà généré depuis
# les jetons, et la CI vérifie qu'il est à jour avant la fusion.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'packages/tokens/src/**'
      - 'outils/site.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publier:
    name: Publier le site
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - id: deploiement
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
