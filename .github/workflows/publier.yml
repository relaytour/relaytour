name: Publication

# Chaque poussée sur main publie les images du serveur sous l'empreinte du commit
# (`:<sha7>`) et sous `:main`. Quand la version du package.json racine n'a pas
# encore de tag `vx.y.z`, le même passage publie aussi `:x.y.z`, `:x.y` et
# `:latest`, puis crée le tag et la release GitHub avec les notes de la version.
# Le dépôt ne déploie rien : l'exploitation d'une installation consomme ces
# images par leur tag (ADR 0007).
#
# Le tag n'est créé qu'une fois les images poussées : une relance ne produit pas
# de doublon, et une release publiée a toujours ses images.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      simulation:
        description: Afficher les étiquettes et le texte de la release sans rien construire ni publier
        type: boolean
        default: true

# Par défaut, le jeton ne fait que lire le dépôt ; seul le job de publication écrit.
permissions:
  contents: read

concurrency:
  group: publication-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verifier:
    # Une simulation ne construit rien : elle n'a pas besoin de la CI.
    if: ${{ !inputs.simulation }}
    uses: ./.github/workflows/ci.yml

  publier:
    name: Images, tag et release
    needs: verifier
    if: ${{ !cancelled() && (needs.verifier.result == 'success' || (inputs.simulation && needs.verifier.result == 'skipped')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/relaytour-server
      SIMULATION: ${{ inputs.simulation == true }}
    steps:
      - name: Refuser une publication hors de main
        if: ${{ github.ref != 'refs/heads/main' && !inputs.simulation }}
        run: |
          echo "::error::Seule main publie. Hors de main, lancer le workflow en simulation."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Calculer la version et les étiquettes
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          SHA7=$(git rev-parse --short=7 HEAD)
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            NOUVELLE=false
            VERSION_IMAGE="$VERSION-dev.$SHA7"
          else
            NOUVELLE=true
            VERSION_IMAGE="$VERSION"
          fi

          # Les étiquettes d'une image ; le suffixe distingue migrations et espace organisateur.
          etiquettes() {
            echo "$IMAGE_REPO:$SHA7$1"
            echo "$IMAGE_REPO:main$1"
            if [ "$NOUVELLE" = true ]; then
              echo "$IMAGE_REPO:$VERSION$1"
              echo "$IMAGE_REPO:${VERSION%.*}$1"
              echo "$IMAGE_REPO:latest$1"
            fi
          }

          {
            echo "version=$VERSION"
            echo "nouvelle=$NOUVELLE"
            echo "version-image=$VERSION_IMAGE"
            echo "construite-le=$(git log -1 --format=%cI)"
            echo "labels<<FIN"
            echo "org.opencontainers.image.title=Relaytour"
            echo "org.opencontainers.image.version=$VERSION_IMAGE"
            echo "org.opencontainers.image.revision=$GITHUB_SHA"
            echo "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
            echo "org.opencontainers.image.licenses=AGPL-3.0-only"
            echo "FIN"
            for cible in runtime migrate orga; do
              suffixe=""
              [ "$cible" = runtime ] || suffixe="-$cible"
              echo "etiquettes-$cible<<FIN"
              etiquettes "$suffixe"
              echo "FIN"
            done
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Relaytour $VERSION_IMAGE"
            echo
            if [ "$NOUVELLE" = true ]; then
              echo "Nouvelle version : le tag \`v$VERSION\` et sa release seront créés."
            else
              echo "Le tag \`v$VERSION\` existe déjà : seules les étiquettes du commit sont publiées."
            fi
            [ "$SIMULATION" = true ] && echo && echo "**Simulation** : rien n'est construit ni publié."
            echo
            echo '```'
            etiquettes ""; etiquettes "-migrate"; etiquettes "-orga"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Rédiger la release
        if: steps.version.outputs.nouvelle == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ! node outils/versionner.mjs release --version "$VERSION" > "$RUNNER_TEMP/notes.md"; then
            echo "::error::Aucune note ne porte la version $VERSION. Lancer « yarn versionner publier » sur develop avant d'avancer main."
            exit 1
          fi
          {
            cat "$RUNNER_TEMP/notes.md"
            echo
            echo "## Images"
            echo
            echo "- \`$IMAGE_REPO:$VERSION\` : API et worker"
            echo "- \`$IMAGE_REPO:$VERSION-migrate\` : migrations"
            echo "- \`$IMAGE_REPO:$VERSION-orga\` : espace organisateur"
            echo
            echo "Une installation qui fixe \`IMAGE_TAG=${VERSION%.*}\` reçoit aussi les correctifs de la version ${VERSION%.*}."
          } > "$RUNNER_TEMP/release.md"
          { echo; echo "### Texte de la release"; echo; cat "$RUNNER_TEMP/release.md"; } >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        if: ${{ !inputs.simulation }}

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: ${{ !inputs.simulation }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire et pousser l'image
        if: ${{ !inputs.simulation }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: packages/server/Dockerfile
          target: runtime
          push: true
          tags: ${{ steps.version.outputs.etiquettes-runtime }}
          labels: ${{ steps.version.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version-image }}
            GIT_SHA=${{ github.sha }}
            BUILT_AT=${{ steps.version.outputs.construite-le }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Construire et pousser l'image de migration
        if: ${{ !inputs.simulation }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: packages/server/Dockerfile
          target: migrator
          push: true
          tags: ${{ steps.version.outputs.etiquettes-migrate }}
          labels: ${{ steps.version.outputs.labels }}
          cache-from: type=gha

      - name: Construire et pousser l'image de l'espace organisateur
        if: ${{ !inputs.simulation }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: packages/server/Dockerfile
          target: orga
          push: true
          tags: ${{ steps.version.outputs.etiquettes-orga }}
          labels: ${{ steps.version.outputs.labels }}
          cache-from: type=gha

      - name: Créer le tag et la release
        if: ${{ steps.version.outputs.nouvelle == 'true' && !inputs.simulation }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "Relaytour $VERSION" \
            --notes-file "$RUNNER_TEMP/release.md" \
            --latest
