name: Image

# Publie l'image du serveur sur ghcr à chaque poussée sur main. Le dépôt ne déploie rien :
# l'exploitation d'une installation consomme cette image par son tag (ADR 0007).
on:
  push:
    branches: [main]

# Par défaut, le jeton ne fait que lire le dépôt ; seul le job de publication écrit sur ghcr.
permissions:
  contents: read

concurrency:
  group: image-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verifier:
    uses: ./.github/workflows/ci.yml

  publier:
    name: Images du serveur et de l'espace organisateur
    needs: verifier
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/relaytour-server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Calculer la version
        id: version
        run: |
          PROCHAINE=$(node -p "require('./packages/server/package.json').version")
          SHA7=$(git rev-parse --short=7 HEAD)
          echo "version=${PROCHAINE}-dev.${SHA7}" >> "$GITHUB_OUTPUT"
          echo "tag=$SHA7" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire et pousser l'image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: packages/server/Dockerfile
          target: runtime
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}:${{ steps.version.outputs.tag }}
            ${{ env.IMAGE_REPO }}:main
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            GIT_SHA=${{ github.sha }}
            BUILT_AT=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Construire et pousser l'image de migration
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: packages/server/Dockerfile
          target: migrator
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}:${{ steps.version.outputs.tag }}-migrate
            ${{ env.IMAGE_REPO }}:main-migrate
          cache-from: type=gha

      - name: Construire et pousser l'image de l'espace organisateur
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: packages/server/Dockerfile
          target: orga
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}:${{ steps.version.outputs.tag }}-orga
            ${{ env.IMAGE_REPO }}:main-orga
          cache-from: type=gha
