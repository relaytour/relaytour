name: Image

# Publie l'image du serveur sur ghcr à chaque poussée sur main. Le dépôt ne déploie rien :
# l'exploitation d'une installation consomme cette image par son tag (ADR 0007).
on:
  push:
    branches: [main]

concurrency:
  group: image-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verifier:
    uses: ./.github/workflows/ci.yml

  publier:
    name: Image du serveur
    needs: verifier
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/relaytour-server
    steps:
      - uses: actions/checkout@v4

      - name: Calculer la version
        id: version
        run: |
          PROCHAINE=$(node -p "require('./versions.json').cibles.serveur.prochaine")
          SHA7=$(git rev-parse --short=7 HEAD)
          echo "version=${PROCHAINE}-dev.${SHA7}" >> "$GITHUB_OUTPUT"
          echo "tag=$SHA7" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire et pousser l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/server/Dockerfile
          target: runtime
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}:${{ steps.version.outputs.tag }}
            ${{ env.IMAGE_REPO }}:main
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            GIT_SHA=${{ github.sha }}
            BUILT_AT=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Construire et pousser l'image de migration
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/server/Dockerfile
          target: migrator
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}:${{ steps.version.outputs.tag }}-migrate
            ${{ env.IMAGE_REPO }}:main-migrate
          cache-from: type=gha
