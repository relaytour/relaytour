# Identité de l'organisation d'exemple. Le thème absent vaut celui de Relaytour.
slug: rencontres-de-la-vallee
nom: Les Rencontres de la Vallée
sigle: Rencontres
fuseauHoraire: Europe/Paris
domainesCourrielAutorises: [exemple.org]
contactRecrutement: contact@exemple.org
# Adresse ouverte par le bouton « Support » de l'espace organisateur (facultatif).
contactSupport: support@exemple.org
pageEquipe: https://exemple.org/equipe
# Adresses de rôle hébergées chez une messagerie grand public : elles s'autorisent
