# Le rassemblement sportif des Rencontres : un événement, une édition par année.
slug: rencontres
nom: Les Rencontres de la Vallée
sigle: Rencontres
nature: EVENEMENT
# Groupes de périmètres, dans l'ordre d'affichage. Sans cette clé, sport et pôle.
groupes:
  - cle: sport
    libelle: Sport
    libellePluriel: Sports
  - cle: pole
    libelle: Pôle
    libellePluriel: Pôles
# Phases de l'activité, dans l'ordre (ADR 0025). Une borne compte les jours depuis le
# premier jour de la période. La dernière phase n'en porte pas. Sans cette clé,
# l'activité garde les quatre phases par défaut.
phases:
  - cle: cadrage
    libelle: Cadrage
    jusquA: J-180
  - cle: preparation
    libelle: Préparation
    jusquA: J-60
  - cle: mobilisation
    libelle: Mobilisation
    jusquA: J-7
  - cle: deroulement
    libelle: Déroulement
    jusquA: J+1
  - cle: bilan
    libelle: Bilan
ordre: 1
# Tous les membres découvrent les périmètres et formulent leurs souhaits (ADR 0012).
souhaitsOuverts: true
# Formulaire public pour rejoindre l'équipe (ADR 0015). Un admin l'ouvre dans
# l'espace organisateur : son ouverture ne se déclare pas ici.
formulaire:
  introduction: >-
    Les Rencontres de la Vallée cherchent des personnes pour préparer la
    prochaine édition. Indiquez ce qui vous intéresse : l'équipe vous répond.
  question: Votre club ou votre commune
  paliers:
    - Quelques heures pendant l'édition
    - Deux à quatre heures par mois
    - Plusieurs heures par semaine
