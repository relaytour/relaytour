# Task templates of the volleyball area.
taches:
  - modele: reserver-le-gymnase
    titre: Book the gym
    description: >-
      The coordinators request the gym and its locker rooms from the town’s sports department, in writing.
    echeance: J-180
  - modele: ouvrir-les-inscriptions
    titre: Open team registration
    description: >-
      The coordinators publish the registration form with the Communication department and set the closing date.
    echeance: J-120
  - modele: etablir-le-planning-des-matchs
    titre: Draw up the match schedule
    description: >-
      The coordinators build the pools and the schedule from the closed registrations, then send it to the teams.
    echeance: J-21
